# Lint every pull request into main. This is also the required status check
# that the Hermes Kanban completion gate waits for before it closes a card
# (roles/tenant/hermes/README.md, "Linear Kanban workers"). No push trigger:
# direct pushes to main don't run it, and the ruleset that requires the check
# lets repository admins bypass it.
name: lint

on:
  pull_request:
    branches: [main]
  # Manual runs (Actions tab, or `gh workflow run lint.yml`), e.g. to make the
  # check known to GitHub before it can be picked in the ruleset.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Same versions as the local toolchain, so CI and local runs agree. The
      # full ansible package, not bare ansible-core: it bundles the collections
      # the playbooks use besides those in requirements.yml (ansible.posix,
      # community.docker, community.general).
      - run: pip install ansible==14.6.0 ansible-lint==25.8.2
      # Galaxy content the playbooks import. The roles go to ~/.ansible/roles
      # (also on roles_path) rather than the first roles_path entry, which is
      # inside the repo and would get linted as if it were ours.
      - run: ansible-galaxy role install -r requirements.yml -p ~/.ansible/roles
      - run: ansible-galaxy collection install -r requirements.yml
      # ansible.cfg points at .vault_pass, which is not in the repo. Linting
      # never decrypts anything, but ansible-lint's syntax check refuses to
      # start without a password file, so hand it a dummy one.
      - run: |
          echo ci-dummy > "$RUNNER_TEMP/vault-pass"
          ANSIBLE_VAULT_PASSWORD_FILE="$RUNNER_TEMP/vault-pass" ansible-lint
