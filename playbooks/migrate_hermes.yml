---
# Run after the VLAN 6 lease has been applied on prydwen. Stages can be run
# individually with --tags provision, --tags stage, or --tags cutover.
- name: Provision Hermes gateway container
  hosts: sentinel-lp
  gather_facts: false
  # See playbooks/init_proxmox.yml.
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_host }}"
      api_user: "{{ proxmox_user }}"
      api_password: "{{ proxmox_password }}"
      node: "{{ proxmox_host }}"
      validate_certs: false
  tasks:
    - name: Build and create CT108
      ansible.builtin.import_role:
        name: proxmox_lxc
        tasks_from: create.yml
      vars:
        proxmox_lxc_guests: [hermes-gateway]
      tags: provision

- name: Stage Hermes gateway without connecting to Matrix
  hosts: hermes-gateway
  gather_facts: false
  tasks:
    - name: Configure CT108 and copy its prebuilt NixOS system
      ansible.builtin.import_role:
        name: hermes_gateway
        tasks_from: main.yml
      tags: stage

- name: Transfer the existing Matrix device state
  hosts: sentinel-lp
  gather_facts: false
  vars:
    hermes_vmid: "{{ hostvars['hermes'].proxmox_lxc.vmid }}"
    hermes_gateway_vmid: "{{ hostvars['hermes-gateway'].proxmox_lxc.vmid }}"
  tasks:
    - name: Check whether Matrix state was already migrated
      ansible.builtin.command: pct exec {{ hermes_gateway_vmid }} -- /bin/sh -c 'test -e /var/lib/hermes/matrix-cutover-ready'
      register: hermes_matrix_cutover_marker
      changed_when: false
      failed_when: false
      tags: cutover

    - name: Preserve CT107's pre-split runtime secrets for rollback
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ hermes_vmid }}"
          - --
          - /bin/sh
          - -c
          - >-
            if ! test -e /var/lib/hermes/secrets.pre-split.env; then
              /run/current-system/sw/bin/cp -p /var/lib/hermes/secrets.env /var/lib/hermes/secrets.pre-split.env &&
              printf 'saved\n';
            fi
      register: hermes_matrix_secrets_backup
      changed_when: "'saved' in hermes_matrix_secrets_backup.stdout_lines"
      when: hermes_matrix_cutover_marker.rc != 0
      tags: cutover

    - name: Stop CT107 gateway before copying its E2EE database
      ansible.builtin.systemd_service:
        name: hermes-agent.service
        state: stopped
      delegate_to: hermes
      when: hermes_matrix_cutover_marker.rc != 0
      tags: cutover

    - name: Preserve an offline Matrix state archive on CT107
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ hermes_vmid }}"
          - --
          - /run/current-system/sw/bin/tar
          - -C
          - /var/lib/hermes/.hermes
          - -cf
          - /var/lib/hermes/matrix-pre-split.tar
          - platforms/matrix
      changed_when: true # Rewrites the offline archive until cutover completes.
      when: hermes_matrix_cutover_marker.rc != 0
      tags: cutover

    - name: Ensure CT108 Hermes home exists
      ansible.builtin.file:
        path: /var/lib/hermes/.hermes
        state: directory
        mode: "0755"
      delegate_to: hermes-gateway
      when: hermes_matrix_cutover_marker.rc != 0
      tags: cutover

    - name: Copy Matrix platform state between stopped and staged guests
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct exec {{ hermes_vmid }} -- /run/current-system/sw/bin/cat /var/lib/hermes/matrix-pre-split.tar |
          pct exec {{ hermes_gateway_vmid }} -- /run/current-system/sw/bin/tar -C /var/lib/hermes/.hermes -xf -
        executable: /bin/bash
      changed_when: true # Extracts state into the staged guest before cutover.
      when: hermes_matrix_cutover_marker.rc != 0
      tags: cutover

    - name: Set CT108 Hermes home ownership
      ansible.builtin.file:
        path: /var/lib/hermes/.hermes
        state: directory
        owner: hermes
        group: hermes
        recurse: true
      delegate_to: hermes-gateway
      when: hermes_matrix_cutover_marker.rc != 0
      tags: cutover

    - name: Check CT107 Matrix E2EE database digest
      ansible.builtin.command:
        cmd: >-
          pct exec {{ hermes_vmid }} --
          /run/current-system/sw/bin/sha256sum /var/lib/hermes/.hermes/platforms/matrix/store/crypto.db
      register: hermes_matrix_source_digest
      changed_when: false
      when: hermes_matrix_cutover_marker.rc != 0
      tags: cutover

    - name: Check CT108 Matrix E2EE database digest
      ansible.builtin.command:
        cmd: >-
          pct exec {{ hermes_gateway_vmid }} --
          /run/current-system/sw/bin/sha256sum /var/lib/hermes/.hermes/platforms/matrix/store/crypto.db
      register: hermes_matrix_target_digest
      changed_when: false
      when: hermes_matrix_cutover_marker.rc != 0
      tags: cutover

    - name: Require matching Matrix E2EE database digests
      ansible.builtin.assert:
        that:
          - hermes_matrix_source_digest.stdout.split()[0] == hermes_matrix_target_digest.stdout.split()[0]
      when: hermes_matrix_cutover_marker.rc != 0
      tags: cutover

    - name: Allow CT108 gateway to start after verified state transfer
      ansible.builtin.file:
        path: /var/lib/hermes/matrix-cutover-ready
        state: touch
        mode: "0644"
      delegate_to: hermes-gateway
      when: hermes_matrix_cutover_marker.rc != 0
      tags: cutover

- name: Activate the agent API and OAuth dashboard on CT107
  hosts: hermes
  gather_facts: false
  tasks:
    - name: Reconcile CT107 Hermes configuration
      ansible.builtin.import_role:
        name: hermes
        tasks_from: main.yml
      tags: cutover

- name: Start Matrix gateway on CT108
  hosts: hermes-gateway
  gather_facts: false
  tasks:
    - name: Start new gateway with the preserved Matrix device
      ansible.builtin.systemd_service:
        name: hermes-agent
        state: started
      tags: cutover
    - name: Gather gateway service state
      ansible.builtin.service_facts:
      tags: cutover

    - name: Confirm gateway service is active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['hermes-agent.service'].state == 'running'
      tags: cutover
