---
# In-place Debian major upgrade for a single LXC tenant.
#
# Usage:
#   ansible-playbook upgrade_lxc_dist.yml                          # defaults to `docker` (CTID 102)
#   ansible-playbook upgrade_lxc_dist.yml -e upgrade_target=omada  # any tenant
#   ansible-playbook upgrade_lxc_dist.yml -e target_codename=trixie
#
# The tenant must be reachable over SSH first (see the DHCPv6 caveat in
# setup_tenants.yml): `ansible <host> -m ping`.
- name: Dist-upgrade an LXC tenant to a new Debian codename
  hosts: "{{ upgrade_target | default('docker') }}"
  vars:
    target_codename: trixie
  tasks:
    - name: Run the Debian dist-upgrade procedure
      ansible.builtin.import_tasks: tasks/debian_dist_upgrade.yml
