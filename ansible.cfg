[defaults]
inventory = inventory
# Repo roles first, then the default user/system paths (geerlingguy.hdparm is
# installed into ~/.ansible/roles by `ansible-galaxy install -r requirements.yml`).
# Each role group is an explicit search root; roles_path is not recursive.
# Playbooks and include_role/import_role calls keep using the short role names.
roles_path = roles/host:roles/common:roles/tenant:roles/maintenance:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
host_key_checking = False
vault_password_file = .vault_pass
# Dedicated automation identity, separate from any operator's personal key. The
# public half is tracked at .ssh/sentinel-lp-ansible.pub and mirrored into
# automation_pubkey (group_vars/all/vars.yml) for deployment onto the fleet.
private_key_file = .ssh/sentinel-lp-ansible

[ssh_connection]
pipelining = True
# Bypass the operator's ~/.ssh/config. Its `Host *` block forwards the agent and
# pins IdentityAgent to a yubikey-agent socket — exactly the personal-credential
# piggybacking this automation identity exists to avoid — and its agenix-managed
# Include is unreadable outside the operator's own login session. IdentitiesOnly
# keeps ssh on private_key_file even when an agent is reachable. The -C and
# ControlMaster/ControlPersist options restore Ansible's own ssh_args defaults,
# which setting this key would otherwise discard.
ssh_args = -F /dev/null -o IdentitiesOnly=yes -o UserKnownHostsFile=/dev/null -C -o ControlMaster=auto -o ControlPersist=60s

# Used by the LXC guests' connection (community.proxmox.proxmox_pct_remote, see
# group_vars/tenant_lxc.yml), which reaches sentinel-lp over Paramiko rather than OpenSSH,
# so the ssh_args above don't apply to it. Mirror them: never fall back to keys in
# ~/.ssh (IdentitiesOnly) and never write the operator's known_hosts.
[paramiko_connection]
look_for_keys = False
record_host_keys = False
