---
# Configuration playbook — safe to re-run any time. Everything here is mutable
# desired-state: it reconciles LXC/VM resources (cores/memory/swap) onto the live
# guests and (re)deploys the application layer. Immutable provisioning lives in
# init_proxmox.yml then init_tenant.yml; run those first (see init_proxmox.yml's
# header for the cold-start lease flow).

- name: Reconcile guest resources on the Proxmox host
  hosts: sentinel-lp
  tasks:
    - name: Reconcile hd-idle spindown for disks with broken -S timers
      ansible.builtin.import_tasks: roles/hd-idle.yml
    - name: Configure NAS LXC
      ansible.builtin.import_role:
        name: nas
        tasks_from: config_lxc.yml
    - name: Reconcile Omada resources
      ansible.builtin.import_role:
        name: omada
        tasks_from: config_lxc.yml
    - name: Reconcile Frigate resources
      ansible.builtin.import_role:
        name: frigate
        tasks_from: config_lxc.yml
    - name: Reconcile Nextcloud resources
      ansible.builtin.import_role:
        name: nextcloud
        tasks_from: config_lxc.yml
    - name: Reconcile seedbox resources
      ansible.builtin.import_role:
        name: seedbox
        tasks_from: config_lxc.yml
    - name: Reconcile Home Assistant resources
      ansible.builtin.import_role:
        name: hass
        tasks_from: config_resources.yml

- name: Configure NAS tenant
  hosts: nas
  tasks:
    - name: Configure NAS services
      ansible.builtin.import_role:
        name: nas
        tasks_from: config_nas.yml

- name: Configure Omada tenant
  hosts: omada
  tasks:
    - name: Configure Omada application
      ansible.builtin.import_role:
        name: omada
        tasks_from: config_omada.yml

- name: Configure Frigate tenant
  hosts: frigate
  tasks:
    - name: Configure Frigate docker stack
      ansible.builtin.import_role:
        name: frigate
        tasks_from: config_docker.yml

- name: Configure Nextcloud tenant
  hosts: nextcloud
  tasks:
    - name: Configure Nextcloud docker stack
      ansible.builtin.import_role:
        name: nextcloud
        tasks_from: config_docker.yml

- name: Configure seedbox tenant
  hosts: seedbox
  tasks:
    - name: Configure seedbox application
      ansible.builtin.import_role:
        name: seedbox
        tasks_from: config_seedbox.yml
