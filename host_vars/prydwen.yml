---
# community.openwrt uses shell modules; keep temporary payloads in RAM-backed /tmp.
openwrt_remote_tmp: /tmp
openwrt_scp_if_ssh: smart

prydwen_cloudflare_api_token: "{{ vault_openwrt_cloudflare_api_token }}"
prydwen_root_password_hash: "{{ vault_openwrt_root_password_hash }}"

prydwen_physical_devices:
  - lan0
  - lan1
  - lan2
  - lan3

prydwen_wan_device: lan0
prydwen_backend_device: lan3.3
prydwen_dmz_device: lan3.6

prydwen_ssh_authorized_keys: "{{ managed_authorized_keys }}"

# Capability packages only. Board-specific drivers remain the firmware's concern.
prydwen_packages:
  - ca-certificates
  - ddns-scripts-cloudflare
  - drill
  - ip-full
  - jool-tools-netfilter
  - kmod-sched-cake
  - kmod-veth
  - luci-app-attendedsysupgrade
  - luci-app-ddns
  - luci-app-firewall
  - luci-app-https-dns-proxy
  - luci-app-sqm
  - luci-app-tor
  - luci-ssl
  - tc-tiny

prydwen_absent_packages:
  - qosify

prydwen_lan_qos_devices:
  - lan1
  - lan3

prydwen_services:
  - network
  - firewall
  - dnsmasq
  - odhcpd
  - https-dns-proxy
  - ddns
  - lan-qos
  - sqm
  - tor
  - uhttpd
  - dropbear

prydwen_stale_files:
  - /etc/config/qosify
  - /etc/config/https-dns-proxy-opkg
  - /etc/config/luci-opkg
  - /etc/config/privoxy
  - /etc/config/stubby
  - /etc/config/tinyproxy
  - /etc/config/tor-opkg
  - /etc/config/ucitrack-opkg
  - /etc/config/uhttpd-opkg

prydwen_jool:
  namespace: jool
  peer_device: openwrt
  router_device: jool
  router_ipv4: 192.168.64.1/24
  translator_ipv4: 192.168.64.2/24
  translator_address: 192.168.64.2
  translator_gateway: 192.168.64.1
  link_local: fe80::64
  pool6: 64:ff9b::/96
  reserved_ports: 32768-32999
  translated_ports: 33000-65535

# Inbound IPv4 to the IPv6-only BunkerWeb edge, through Jool's static NAT64 mappings: the
# router DNATs wan4:<wan_port> to the translator's <translated_port> (redirect_bunkerweb_*
# below), and Jool turns that into <ipv6>:<port>. The edge's ULA is used rather than its GUA
# because a static mapping cannot follow a changing prefix. translated_port must be inside
# translated_ports above.
prydwen_jool_inbound:
  - { name: http, wan_port: 80, translated_port: 64080, ipv6: "fd5a:715f:1edc:a706::2b", port: 80 }
  - { name: https, wan_port: 443, translated_port: 64443, ipv6: "fd5a:715f:1edc:a706::2b", port: 443 }
  - { name: webrtc, wan_port: 8555, translated_port: 64555, ipv6: "fd5a:715f:1edc:a706::2b", port: 8555 }

# Named defaults and disabled leftovers that conflict with this topology.
prydwen_uci_absent_options:
  - network.lan
  - network.wan6
  - dhcp.lan
  - ddns.myddns_ipv4
  - ddns.myddns_ipv6
  - tor-hs.sshd
  - tor-hs.nextcloud

prydwen_uci_absent_sections:
  # End hosts own DSCP classification; prydwen only queues existing markings.
  - { config: firewall, type: rule, find: { name: Prioritize-USBIP-to-server } }
  - { config: firewall, type: rule, find: { name: Prioritize-USBIP-from-server } }
  - { config: firewall, type: rule, find: { name: Prioritize-Sunshine-TCP-to-server } }
  - { config: firewall, type: rule, find: { name: Prioritize-Sunshine-TCP-from-server } }
  - { config: firewall, type: rule, find: { name: Prioritize-Sunshine-UDP-to-server } }
  - { config: firewall, type: rule, find: { name: Prioritize-Sunshine-UDP-from-server } }
  - config: firewall
    type: zone
    find:
      name: lan
  - config: firewall
    type: forwarding
    find:
      src: lan
      dest: wan
  - config: https-dns-proxy
    type: https-dns-proxy
    find:
      resolver_url: https://cloudflare-dns.com/dns-query
  - config: https-dns-proxy
    type: https-dns-proxy
    find:
      resolver_url: https://dns.google/dns-query
  - config: network
    type: route6
    find:
      target: 64:ff9a::/96
  # The blanket WAN->DMZ forwarding. Replaced by a per-host rule (rule_bunkerweb), so only the
  # BunkerWeb edge is reachable from the internet in the dmz. The edge serves the *.us services
  # and relays Frigate's WebRTC media.
  - config: firewall
    type: forwarding
    find:
      src: wan
      dest: dmz
  # The per-name ddns services for the *.us hostnames are gone: those names are CNAMEs to
  # edge_hostname, which the `edge`/`edge4` services below keep current. A leftover
  # per-name service would overwrite its CNAME with a stale address.
  - config: ddns
    type: service
    find:
      lookup_host: "{{ matrix_hostname }}"
  - config: ddns
    type: service
    find:
      lookup_host: "{{ hermes_hostname }}"
  - config: ddns
    type: service
    find:
      lookup_host: "{{ seafile_hostname }}"
  - config: ddns
    type: service
    find:
      lookup_host: "{{ dav_hostname }}"
  # Nextcloud is shut down (CT103 stays in Proxmox, stopped and not autostarted): its direct
  # public exposure (own TLS, not behind the edge) and its ddns record are removed.
  - config: ddns
    type: service
    find:
      lookup_host: "{{ nextcloud_hostname }}"
  - config: firewall
    type: rule
    find:
      name: Allow-Nextcloud
  # Frigate's WebRTC media is relayed over TCP by the BunkerWeb edge (port 8555, then go2rtc
  # on frigate's dmz NIC), so its direct opening and its ddns record go too.
  - config: ddns
    type: service
    find:
      lookup_host: "{{ frigate_webrtc_hostname }}"
  - config: firewall
    type: rule
    find:
      name: Allow-Frigate-WebRTC
  # Home Assistant is behind the BunkerWeb edge as hass.us (a CNAME to edge.us), so its
  # direct opening (own TLS on the backend GUA) and the old hass-us ddns record go.
  - config: ddns
    type: service
    find:
      lookup_host: "{{ hass_legacy_hostname }}"
  - config: firewall
    type: rule
    find:
      name: Allow-Hass

# Values applied to packaged/generated sections without replacing their defaults.
prydwen_uci_values:
  - key: system.@system[0]
    value:
      hostname: prydwen
      zonename: America/New_York
      timezone: EST5EDT,M3.2.0,M11.1.0
  - key: network.loopback
    value:
      device: lo
      proto: static
      ipaddr: 127.0.0.1
      netmask: 255.0.0.0
  - key: network.globals
    value:
      ula_prefix: fd5a:715f:1edc:a700::/56
      packet_steering: "1"
  - key: dhcp.@dnsmasq[0]
    value:
      noresolv: "1"
      strictorder: "1"
      doh_backup_noresolv: "1"
      doh_backup_server:
        - 0::1#5453
      doh_server:
        - ::1#5053
        - ::1#5054
      server:
        - ::1#5054
        - ::1#5053
  - key: firewall.@defaults[0]
    value:
      synflood_protect: "1"
      drop_invalid: "1"
  - key: dropbear.@dropbear[0]
    value:
      PasswordAuth: "on"
      RootPasswordAuth: "on"
      Port: "22"
      Interface: internal
  - key: https-dns-proxy.config
    value:
      dnsmasq_config_update: "*"
      force_dns: "0"
      force_dns_port:
        - "53"
        - "853"
      procd_trigger_wan6: "0"
      verbosity: "1"
  - key: sqm.eth1
    value:
      enabled: "1"
      interface: "{{ prydwen_wan_device }}"
      download: "330000"
      upload: "330000"
      qdisc: cake
      script: piece_of_cake.qos
      linklayer: ethernet
      overhead: "44"
  - key: tor.conf
    value:
      default: /etc/tor/torrc
      generated: /tmp/torrc
      tail_include:
        - /etc/tor/torrc
        - /etc/tor/torrc_generated
        - /etc/tor/socks.conf
        - /etc/tor/torrc_custom
  - key: tor-hs.common
    value:
      GenConf: /etc/tor/torrc_generated
      HSDir: /etc/tor/hidden_service
      RestartTor: "true"
      UpdateTorConf: "true"
  - key: uhttpd.main
    value:
      redirect_https: "1"

# Every custom section has a stable UCI identifier. Packaged defaults remain implicit.
prydwen_uci_sections:
  # Physical, VLAN, and bridge devices.
  - config: network
    type: device
    name: device_lan0
    find: { name: lan0 }
    value: {}
  - config: network
    type: device
    name: device_lan1
    find: { name: lan1 }
    value:
      ipv6: "1"
      ip6segmentrouting: "1"
      acceptlocal: "1"
  - config: network
    type: device
    name: device_lan2
    find: { name: lan2 }
    value:
      ipv6: "1"
  - config: network
    type: device
    name: device_lan3
    find: { name: lan3 }
    value:
      ipv6: "1"
      ip6segmentrouting: "1"
  - config: network
    type: device
    name: vlan_lan1_2
    find: { name: lan1.2 }
    value: { type: 8021q, ifname: lan1, vid: "2", ipv6: "1" }
  - config: network
    type: device
    name: vlan_lan2_2
    find: { name: lan2.2 }
    value: { type: 8021q, ifname: lan2, vid: "2", ipv6: "1" }
  - config: network
    type: device
    name: bridge_internal
    find: { name: br-internal }
    value:
      type: bridge
      ports: [lan1.2, lan2.2]
  - config: network
    type: device
    name: bridge_infra
    find: { name: br-infra }
    value:
      type: bridge
      ports: [lan1, lan2, lan3]
  - config: network
    type: device
    name: vlan_lan3_3
    find: { name: lan3.3 }
    value:
      type: 8021q
      ifname: lan3
      vid: "3"
      acceptlocal: "1"
      ipv6: "1"
      ip6segmentrouting: "1"
  - config: network
    type: device
    name: vlan_lan1_4
    find: { name: lan1.4 }
    value: { type: 8021q, ifname: lan1, vid: "4", ipv6: "1" }
  - config: network
    type: device
    name: vlan_lan2_4
    find: { name: lan2.4 }
    value: { type: 8021q, ifname: lan2, vid: "4", ipv6: "1" }
  - config: network
    type: device
    name: vlan_lan3_4
    find: { name: lan3.4 }
    value: { type: 8021q, ifname: lan3, vid: "4", ipv6: "1" }
  - config: network
    type: device
    name: bridge_iot
    find: { name: br-iot }
    value:
      type: bridge
      ports: [lan1.4, lan2.4, lan3.4]
  - config: network
    type: device
    name: vlan_lan1_5
    find: { name: lan1.5 }
    value: { type: 8021q, ifname: lan1, vid: "5", ipv6: "1" }
  - config: network
    type: device
    name: vlan_lan2_5
    find: { name: lan2.5 }
    value: { type: 8021q, ifname: lan2, vid: "5", ipv6: "1" }
  - config: network
    type: device
    name: bridge_guest
    find: { name: br-guest }
    value:
      type: bridge
      ports: [lan1.5, lan2.5]
  - config: network
    type: device
    name: vlan_lan3_6
    find: { name: lan3.6 }
    value: { type: 8021q, ifname: lan3, vid: "6" }

  # Layer-3 interfaces and NAT64 route.
  - config: network
    type: interface
    name: wan
    find: { device: lan0, proto: dhcpv6 }
    value:
      reqaddress: try
      reqprefix: auto
      peerdns: "0"
      dns: [2001:4860:4860::6464, 2001:4860:4860::64]
      dns_metric: "50"
  - config: network
    type: interface
    name: wan4
    find: { device: lan0, proto: dhcp }
    value:
      peerdns: "0"
      delegate: "0"
      dns: [9.9.9.9, 149.112.112.112]
      dns_metric: "55"
  - config: network
    type: interface
    name: nat64
    find: { device: jool }
    value:
      proto: static
      ipaddr: 192.168.64.1
      netmask: 255.255.255.0
      ip6assign: "64"
      ip6hint: "64"
      delegate: "0"
  - config: network
    type: route6
    name: route_nat64
    find: { target: "64:ff9b::/96" }
    value:
      interface: nat64
      gateway: fe80::64
  - config: network
    type: interface
    name: internal
    find: { device: br-internal }
    value:
      proto: static
      delegate: "0"
      ip6assign: "64"
      ip6hint: "2"
      dns: ["::1"]
      multipath: "off"
  - config: network
    type: interface
    name: infra
    find: { device: br-infra, proto: static }
    value:
      ip6assign: "64"
      ip6hint: "1"
      delegate: "0"
      ip6class: [local]
      auto: "0"
  - config: network
    type: interface
    name: infra4
    find: { device: br-infra, ipaddr: 192.168.1.1 }
    value:
      proto: static
      netmask: 255.255.255.0
      delegate: "0"
  - config: network
    type: interface
    name: backend
    find: { device: lan3.3 }
    value:
      proto: static
      delegate: "0"
      ip6assign: "64"
      ip6hint: "3"
  - config: network
    type: interface
    name: backend4
    find: { device: lan3.3, ipaddr: 192.168.3.1 }
    value:
      proto: static
      netmask: 255.255.255.0
      delegate: "0"
  - config: network
    type: interface
    name: iot
    find: { device: br-iot, proto: static }
    value:
      delegate: "0"
      ip6assign: "64"
      ip6hint: "4"
      ip6class: [local]
      auto: "0"
  - config: network
    type: interface
    name: iot4
    find: { device: br-iot, ipaddr: 192.168.4.1 }
    value:
      proto: static
      netmask: 255.255.255.0
      delegate: "0"
  - config: network
    type: interface
    name: guest
    find: { device: br-guest }
    value:
      proto: static
      delegate: "0"
      ip6assign: "64"
      ip6hint: "5"
  - config: network
    type: interface
    name: guest4
    find: { device: br-guest, ipaddr: 192.168.5.1 }
    value:
      proto: static
      netmask: 255.255.255.0
      delegate: "0"
  - config: network
    type: interface
    name: dmz
    find: { device: lan3.6 }
    value:
      proto: static
      delegate: "0"
      ip6assign: "64"
      ip6hint: "6"
      multipath: "off"
  - config: network
    type: interface
    name: dmz4
    find: { device: lan3.6, ipaddr: 192.168.6.1 }
    value:
      proto: static
      netmask: 255.255.255.0
      delegate: "0"
      auto: "0"

  # DHCP and router advertisements. Common start/limit/lease defaults are omitted.
  - config: dhcp
    type: dhcp
    name: wan
    find: { interface: wan }
    value: { ignore: "1" }
  - config: dhcp
    type: dhcp
    name: nat64
    find: { interface: nat64 }
    value: { ignore: "1", ra: server }
  - config: dhcp
    type: dhcp
    name: internal
    find: { interface: internal }
    value:
      ra: server
      dhcpv6: server
      dhcp_option: ["108,0:0:7:8"]
      ra_flags: [managed-config, other-config]
      ra_preference: medium
      ra_pref64: "64:ff9b::/96"
  - config: dhcp
    type: dhcp
    name: backend
    find: { interface: backend }
    value:
      leasetime: 10m
      dhcp_option: ["108,0:0:7:8"]
      ra: server
      ra_flags: [managed-config, other-config]
      dhcpv6: server
  - config: dhcp
    type: dhcp
    name: backend4
    find: { interface: backend4 }
    value: { leasetime: 5m, dynamicdhcp: "0" }
  - config: dhcp
    type: dhcp
    name: infra
    find: { interface: infra }
    value:
      ra: server
      ra_flags: [managed-config, other-config]
      dhcpv6: server
      dhcp_option: ["108,0:0:7:8"]
      ra_slaac: "0"
  - config: dhcp
    type: dhcp
    name: infra4
    find: { interface: infra4 }
    value: {}
  - config: dhcp
    type: dhcp
    name: iot
    find: { interface: iot }
    value:
      ra: server
      ra_flags: [managed-config, other-config]
      dhcpv6: server
      dhcp_option: ["108,0:0:7:8"]
  - config: dhcp
    type: dhcp
    name: iot4
    find: { interface: iot4 }
    value: { leasetime: 5m }
  - config: dhcp
    type: dhcp
    name: guest
    find: { interface: guest }
    value:
      ra: server
      ra_flags: [managed-config, other-config]
      dhcpv6: server
      dhcp_option: ["108,0:0:7:8"]
  - config: dhcp
    type: dhcp
    name: guest4
    find: { interface: guest4 }
    value: {}
  - config: dhcp
    type: dhcp
    name: dmz
    find: { interface: dmz }
    value:
      ra: server
      dhcpv6: server
      ra_flags: [managed-config, other-config]
      dhcp_option: ["108,0:0:7:8"]
      ra_preference: medium
      ra_slaac: "0"
  - config: dhcp
    type: dhcp
    name: dmz4
    find: { interface: dmz4 }
    value: {}

  # Static IPv6 and IPv4 leases.
  - config: dhcp
    type: host
    name: host_paladin_iii
    find: { name: paladin-iii }
    value: { hostid: "10", leasetime: 3h, duid: ["000406b89e615015bb5e8facc04a17bda0d5"] }
  - config: dhcp
    type: host
    name: host_cam_indoor_v6
    find: { name: cam-indoor, duid: "00010001fffbe006a06032037bbb" }
    value: { leasetime: 10m, hostid: "19" }
  - config: dhcp
    type: host
    name: host_paladin_ii
    find: { name: paladin-ii }
    value: { duid: "0001000131185e1d0cdd2469ba86", mac: "2C:16:DB:A2:81:C9", hostid: "11", leasetime: 10m }
  - config: dhcp
    type: host
    name: host_nas
    find: { name: nas }
    value: { duid: "000100012f05e88bbc241182dd26", mac: "BC:24:11:4A:84:68", hostid: "20", leasetime: 10m }
  - config: dhcp
    type: host
    name: host_omada_v6
    find: { name: omada, duid: "000100012f03d643bc24111754ba" }
    value: { hostid: "21", leasetime: 10m }
  - config: dhcp
    type: host
    name: host_frigate_backend
    find: { name: frigate-backend }
    value:
      hostid: "22"
      leasetime: 10m
      duid: ["00020000ab111f881429a3da7a45%477236ad"]
      mac: ["BC:24:11:E4:E8:19"]
  - config: dhcp
    type: host
    name: host_frigate_dmz
    find: { name: frigate-dmz }
    value: { hostid: "22", leasetime: 10m, duid: ["00020000ab111f881429a3da7a45%54efee6a"] }
  - config: dhcp
    type: host
    name: host_nextcloud
    find: { name: nextcloud }
    value: { leasetime: 10m, hostid: "23", duid: ["00020000ab110d469aa3877e37f4%7d9e78ea"] }
  # Home Assistant (CT113). Assigned, not discovered: the image pins this DUID/IAID
  # (roles/tenant/hass/files/nixos/configuration.nix). Same hostid as the HAOS VM had, so
  # the iot and Frigate guests keep trusting the same address. Matched on name + hostid
  # (host_hass_v4 shares the name but has no hostid), so the old VM's entry
  # (duid 0004e51a…) is updated in place. The MAC lives on host_hass_v4 only.
  - config: dhcp
    type: host
    name: host_hass_v6
    find: { name: hass, hostid: "24" }
    value: { hostid: "24", leasetime: 10m, duid: ["00020000ab11686173736c780071%68617373"] }
  - config: dhcp
    type: host
    name: host_seedbox_v6
    find: { name: seedbox, duid: "000100012f6f9c40bc2411f3044c" }
    value: { leasetime: 10m, hostid: "25" }
  - config: dhcp
    type: host
    name: host_immich
    find: { name: immich }
    value:
      leasetime: 10m
      hostid: "26"
      duid: ["00020000ab119aa14aeb62221c98%93634b9"]
      mac: ["BC:24:11:D4:18:63"]
  # Assigned, not discovered: the matrix guest pins this exact DUID/IAID in its
  # image (roles/tenant/matrix/files/nixos/configuration.nix), so unlike every other lease
  # here this one can be written before the container has ever booted.
  - config: dhcp
    type: host
    name: host_matrix
    find: { name: matrix }
    value:
      leasetime: 10m
      hostid: "27"
      duid: ["00020000ab116d6174726978006a%6d617472"]
      mac: ["BC:24:11:A6:7C:C4"]
  # Assigned, not discovered, for the same reason as matrix above — hermes is the
  # other NixOS guest and pins this DUID/IAID in its image
  # (roles/tenant/hermes/files/nixos/configuration.nix). Note there is deliberately no
  # matching `ddns service` section: this one lives on backend and is not meant to
  # resolve publicly.
  - config: dhcp
    type: host
    name: host_hermes
    find: { name: hermes }
    value:
      leasetime: 10m
      hostid: "28"
      duid: ["00020000ab116865726d6573006b%6865726d"]
      mac: ["BC:24:11:0E:12:5C"]
  - config: dhcp
    type: host
    name: host_hermes_gateway
    find: { name: hermes-gateway }
    value:
      leasetime: 10m
      hostid: "29"
      duid: ["00020000ab116865726d6777006c%686d6777"]
      mac: ["BC:24:11:6C:29:01"]
  # Public Seafile tenant (CT109, dmz). Assigned, not discovered, like matrix: the
  # guest is NixOS and pins this exact DUID/IAID in its image
  # (roles/tenant/seafile/files/nixos/configuration.nix), so this lease can be written
  # before the container has ever booted. hwaddr is pinned in host_vars/seafile.yml.
  - config: dhcp
    type: host
    name: host_seafile
    find: { name: seafile }
    value:
      leasetime: 10m
      hostid: "2a"
      duid: ["00020000ab1173656166696c006d%73656166"]
      mac: ["BC:24:11:5A:F1:09"]
