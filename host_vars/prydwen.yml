  # Firewall zones and forwarding graph.
  - config: firewall
    type: zone
    name: zone_internal
    find: { name: internal }
    value: { input: ACCEPT, output: ACCEPT, forward: ACCEPT, network: [internal] }
  - config: firewall
    type: zone
    name: zone_wan
    find: { name: wan }
    value: { input: REJECT, output: ACCEPT, forward: REJECT, masq: "1", mtu_fix: "1", network: [wan, wan4] }
  - config: firewall
    type: zone
    name: zone_nat64
    find: { name: nat64 }
    value: { input: ACCEPT, output: ACCEPT, forward: ACCEPT, network: [nat64] }
  - config: firewall
    type: zone
    name: zone_backend
    find: { name: backend }
    value: { input: ACCEPT, output: ACCEPT, forward: ACCEPT, network: [backend, backend4] }
  - config: firewall
    type: zone
    name: zone_infra
    find: { name: infra }
    value: { input: ACCEPT, output: ACCEPT, forward: ACCEPT, network: [infra, infra4] }
  - config: firewall
    type: zone
    name: zone_iot
    find: { name: iot }
    value: { input: ACCEPT, output: ACCEPT, forward: ACCEPT, network: [iot4, iot] }
  - config: firewall
    type: zone
    name: zone_dmz
    find: { name: dmz }
    value: { input: ACCEPT, output: ACCEPT, forward: ACCEPT, network: [dmz, dmz4] }
  - config: firewall
    type: zone
    name: zone_guest
    find: { name: guest }
    value: { input: ACCEPT, output: ACCEPT, forward: ACCEPT, network: [guest, guest4], log: "1" }
  - config: firewall
    type: forwarding
    name: forward_internal_wan
    find: { src: internal, dest: wan }
    value: {}
  - { config: firewall, type: forwarding, name: forward_internal_nat64, find: { src: internal, dest: nat64 }, value: {}}
  - { config: firewall, type: forwarding, name: forward_nat64_wan, find: { src: nat64, dest: wan }, value: {}}
  - { config: firewall, type: forwarding, name: forward_backend_nat64, find: { src: backend, dest: nat64 }, value: {}}
  - { config: firewall, type: forwarding, name: forward_backend_wan, find: { src: backend, dest: wan }, value: {}}
  - { config: firewall, type: forwarding, name: forward_internal_infra, find: { src: internal, dest: infra }, value: {}}
  - { config: firewall, type: forwarding, name: forward_internal_backend, find: { src: internal, dest: backend }, value: {}}
  - { config: firewall, type: forwarding, name: forward_internal_iot, find: { src: internal, dest: iot }, value: {}}
  - { config: firewall, type: forwarding, name: forward_backend_iot, find: { src: backend, dest: iot }, value: {}}
  - { config: firewall, type: forwarding, name: forward_dmz_wan, find: { src: dmz, dest: wan }, value: {}}
  - { config: firewall, type: forwarding, name: forward_internal_dmz, find: { src: internal, dest: dmz }, value: {}}
  - { config: firewall, type: forwarding, name: forward_dmz_backend, find: { src: dmz, dest: backend }, value: {}}
  - { config: firewall, type: forwarding, name: forward_backend_dmz, find: { src: backend, dest: dmz }, value: {}}
  - { config: firewall, type: forwarding, name: forward_guest_nat64, find: { src: guest, dest: nat64 }, value: {}}
  - { config: firewall, type: forwarding, name: forward_guest_wan, find: { src: guest, dest: wan }, value: {}}
  - { config: firewall, type: forwarding, name: forward_internal_guest, find: { src: internal, dest: guest }, value: {}}
  - { config: firewall, type: forwarding, name: forward_dmz_nat64, find: { src: dmz, dest: nat64 }, value: {}}
  - { config: firewall, type: forwarding, name: forward_iot_wan, find: { src: iot, dest: wan }, value: {}}

  # Standard rules with topology-specific destinations and custom rules.
  - config: firewall
    type: rule
    name: rule_ipsec_esp
    find: { name: Allow-IPSec-ESP }
    value: { dest: internal }
    replace: false
  - config: firewall
    type: rule
    name: rule_isakmp
    find: { name: Allow-ISAKMP }
    value: { dest: internal }
    replace: false
  - config: firewall
    type: rule
    name: rule_virtualhere
    find: { name: Allow-VirtualHere }
    value: { proto: [tcp], src: backend, dest: internal, dest_port: "7575 3240", target: ACCEPT }
  - config: firewall
    type: rule
    name: rule_moonlight
    find: { name: Allow-Moonlight }
    value: { proto: [udp], src: backend, dest: internal, target: ACCEPT, src_port: 47998-48000 }
  - config: firewall
    type: rule
    name: rule_vertibird
    find: { name: Allow-Vertibird }
    value: { proto: [tcp], src: nat64, dest: infra, dest_port: "80 443 8088 8006", target: ACCEPT }
  # WAN -> DMZ is closed by default (no wan->dmz forwarding); each public host is
  # opened here by its stable interface identifier. "::xx/-56" matches that suffix under
  # whatever /56 the ISP currently delegates (the 6 is the dmz's ip6hint).
  # The BunkerWeb edge, directly reachable: 80/443 for the *.us sites, 8555 for Frigate's
  # WebRTC media (TCP relay on the edge). IPv4 arrives through the Jool-bound DNATs below.
  - config: firewall
    type: rule
    name: rule_bunkerweb
    find: { name: Allow-BunkerWeb }
    value:
      proto: [tcp]
      src: wan
      dest: dmz
      dest_port: "80 443 8555"
      target: ACCEPT
      family: ipv6
      dest_ip: ["0:0:0:6::2b/-56"]
  # The IPv6 half of that path: Jool (nat64 zone) opens the translated connection to the edge's
  # ULA, and there is deliberately no zone-wide nat64 -> dmz forwarding, so allow exactly these
  # ports to exactly that host (replies ride the existing dmz -> nat64 forwarding).
  - config: firewall
    type: rule
    name: rule_bunkerweb_nat64
    find: { name: Allow-NAT64-BunkerWeb }
    value:
      proto: [tcp]
      src: nat64
      dest: dmz
      dest_port: "80 443 8555"
      dest_ip: ["fd5a:715f:1edc:a706::2b"]
      target: ACCEPT
      family: ipv6
  # IPv4 reaches the IPv6-only edge through Jool (prydwen_jool_inbound): DNAT to the translator's
  # static NAT64 mappings, which turn the connection into one to the edge's ULA. Clients appear
  # at the edge as 64:ff9b::<their IPv4>.
  - config: firewall
    type: redirect
    name: redirect_bunkerweb_http
    find: { name: DNAT-BunkerWeb-http }
    value:
      proto: [tcp]
      src: wan
      src_dport: "80"
      dest: nat64
      dest_ip: 192.168.64.2
      dest_port: "64080"
      target: DNAT
      family: ipv4
  - config: firewall
    type: redirect
    name: redirect_bunkerweb_https
    find: { name: DNAT-BunkerWeb-https }
    value:
      proto: [tcp]
      src: wan
      src_dport: "443"
      dest: nat64
      dest_ip: 192.168.64.2
      dest_port: "64443"
      target: DNAT
      family: ipv4
  - config: firewall
    type: redirect
    name: redirect_bunkerweb_webrtc
    find: { name: DNAT-BunkerWeb-webrtc }
    value:
      proto: [tcp]
      src: wan
      src_dport: "8555"
      dest: nat64
      dest_ip: 192.168.64.2
      dest_port: "64555"
      target: DNAT
      family: ipv4

  # DNS-over-HTTPS resolvers.
  - config: https-dns-proxy
    type: https-dns-proxy
    name: resolver_google_dns64
    find: { resolver_url: "https://dns64.dns.google/dns-query" }
    value:
      bootstrap_dns: 2001:4860:4860::6464,2001:4860:4860::64
      listen_addr: ::1
      listen_port: "5054"
      force_ipv6_resolvers: "1"
  - config: https-dns-proxy
    type: https-dns-proxy
    name: resolver_cloudflare_dns64
    find: { resolver_url: "https://dns64.cloudflare-dns.com/dns-query" }
    value:
      bootstrap_dns: 2606:4700:4700::64,2606:4700:4700::6400
      listen_addr: ::1
      listen_port: "5053"
      force_ipv6_resolvers: "1"

  # Cloudflare DDNS services. The shared API token is never logged. Hostnames come
  # from group_vars/all/vars.yml (zone in vault); `domain` is cloudflare.com-v4's
  # <host>@<zone> form.
  # The BunkerWeb edge's public name (edge_hostname); matrix.us, hermes.us, seafile.us and
  # frigate-webrtc.us are CNAMEs to it. AAAA from the edge's dmz lease (pinned, host_bunkerweb),
  # A from the router's own WAN address (the Jool-bound DNATs). Both records must already exist in
  # Cloudflare: ddns updates, it does not create.
  - config: ddns
    type: service
    name: edge
    find: { lookup_host: "{{ edge_hostname }}", use_ipv6: "1" }
    secret: true
    value:
      service_name: cloudflare.com-v4
      use_ipv6: "1"
      enabled: "1"
      domain: "edge.us@{{ public_domain }}"
      username: Bearer
      password: "{{ prydwen_cloudflare_api_token }}"
      use_https: "1"
      cacert: /etc/ssl/certs
      ip_source: script
      ip_script: >-
        /bin/sh -c "ubus call dhcp ipv6leases | jsonfilter -e
        \"@['device']['{{ prydwen_dmz_device }}']['leases'][@.hostname='bunkerweb']['ipv6-addr'][0]['address']\""
      interface: wan
      use_syslog: "2"
      check_unit: minutes
      force_unit: minutes
      retry_unit: seconds
  - config: ddns
    type: service
    name: edge4
    find: { lookup_host: "{{ edge_hostname }}", use_ipv6: "0" }
    secret: true
    value:
      service_name: cloudflare.com-v4
      use_ipv6: "0"
      enabled: "1"
      domain: "edge.us@{{ public_domain }}"
      username: Bearer
      password: "{{ prydwen_cloudflare_api_token }}"
      use_https: "1"
      cacert: /etc/ssl/certs
      ip_source: network
      ip_network: wan4
      interface: wan4
      use_syslog: "2"
      check_unit: minutes
      force_unit: minutes
      retry_unit: seconds
  # Route the CLAT EAM prefix to sentinel-lp specifically. Every other route6/
  # ip6assign entry in this file derives a prefix for an interface the router
  # itself terminates; this one is different — the prefix is pure Jool-internal
  # translation bookkeeping on the Proxmox host's CLAT instance (roles/host/clat/),
  # never assigned to any router-local interface, so no ip6assign/ip6hint stanza
  # is needed here — just a static route to where it actually lives. Value chosen
  # as fd5a:715f:1edc:a746::/64: hint '46' (464XLAT) against the router's own
  # fd5a:715f:1edc:a700::/56 ULA delegation, following the same pattern that
  # produced nat64's fd5a:715f:1edc:a764::/64 for hint '64'.
  - config: network
    type: route6
    name: route_clat
    find: { target: "fd5a:715f:1edc:a746::/64" }
    value:
      interface: backend
      gateway: fd5a:715f:1edc:a703::10
