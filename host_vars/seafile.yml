---
# LXC definition, consumed on the Proxmox host by roles/host/proxmox_lxc.
proxmox_lxc:
  vmid: 109
  hostname: seafile
  # Not a pveam Debian image: a NixOS tarball built from roles/tenant/seafile/files/nixos by
  # roles/tenant/seafile/tasks/build_template.yml, which runs right before the create task.
  template: nixos
  template_role: seafile
  # ostype=nixos stops Proxmox applying its Debian-style guest fixups.
  ostype: nixos
  nixos_path_shim: true
  # Nix store + Docker images (~2 GB), MariaDB, Caddy state. Library blocks live on ZFS (mp0).
  # Grow later with `pct resize 109 rootfs +NG`.
  disk: local-lvm:32
  cores: 2
  # Headroom over upstream's currently recommended 2 GB for server + MariaDB + cache,
  # and for nixos-rebuild evaluation.
  memory: 4096
  swap: 1024
  netif:
    # dmz (VLAN 6) — the zone is already forwarded from wan (see host_vars/prydwen.yml
    # forward_wan_dmz), so a public service needs no per-service firewall rule.
    # ip6=manual: addressing is owned by systemd-networkd, declared in
    # files/nixos/configuration.nix (which also pins the DHCPv6 DUID/IAID the router's
    # reservation matches) rather than pushed in with pct exec.
    # hwaddr is pinned so the router's lease (matched on mac as well as duid) stays
    # valid if the container is ever recreated.
    net6: "name=eth6,bridge=vmbr1,tag=6,firewall=1,ip6=manual,hwaddr=BC:24:11:5A:F1:09"
  unprivileged: true
  features:
    - nesting=1 # Required to run docker, and by the Nix daemon's build sandbox
    # No fuse: no borg job; backup scope is the nightly DB dump onto the pool (see README).
  # Library data and DB dumps on the encrypted RAID-Z pool. No idmap: the Seafile
  # image runs as container root, which an unprivileged CT maps to host uid 100000,
  # so these are owned by that uid (hermes-gateway's pattern).
  host_dirs:
    - path: /mnt/frontpanel-pool/frontpanel-dataset/Seafile
      owner: "100000"
      group: "100000"
      # o+x (traverse, no listing): this is the container's /shared, and the image's
      # nginx workers (www-data) reopen /shared/seafile/logs/* themselves after the
      # nightly logrotate USR1. With 0750 that reopen fails silently and they keep
      # writing to the rotated file.
      mode: "0751"
    - path: /mnt/frontpanel-pool/frontpanel-dataset/Backup/seafile
      owner: "100000"
      group: "100000"
      mode: "0750"
  config_lines:
    # Keep in step with dataDir / backupDir in files/nixos/configuration.nix.
    # at_create: present at first boot, so no `pct reboot` is needed.
    - key: mp0
      value: /mnt/frontpanel-pool/frontpanel-dataset/Seafile,mp=/mnt/seafile
      at_create: true
    - key: mp1
      value: /mnt/frontpanel-pool/frontpanel-dataset/Backup/seafile,mp=/mnt/seafile-backup
      at_create: true
  # No networkd_interfaces: eth6 addressing ships inside the NixOS image.
