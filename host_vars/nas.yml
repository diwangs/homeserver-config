---
# LXC definition, consumed on the Proxmox host by roles/host/proxmox_lxc (see its
# defaults/main.yml for the schema). vmid/hostname/template/disk/unprivileged/
# features/startup are creation-time only; cores/memory/swap and config_lines are
# reconciled by playbooks/configure.yml.
proxmox_lxc:
  vmid: 100
  hostname: nas
  # TODO: make sure the template exist first?
  template: debian12
  disk: local-lvm:4 # 4 GB
  cores: 1
  memory: 256 # 256 MB
  swap: 1024
  netif:
    # net0: backend, DHCPv6
    net0: "name=eth0,bridge=vmbr1,tag=3,firewall=1,ip6=dhcp"
  # BUG: https://github.com/ansible-collections/community.general/issues/8982
  # (mount_volumes can't be used, hence the mpN config_lines below)
  features:
    - nesting=1 # Required somehow
  # Boot NAS first, then wait 180s before starting the other containers so their
  # storage (mounted from the NAS) is available beforehand.
  startup:
    - order=1
    - up=180
  # This is so that the owner of the files are the same regardless of host or tenant
  idmap:
    id: 1000
    host_id: 1000
  config_lines:
    - key: mp0
      value: /mnt/frontpanel-pool/frontpanel-dataset,mp=/mnt/frontpanel-dataset
    # Shared Nextcloud directory, also bind-mounted into nextcloud. nas accesses it
    # as `diwangs` (uid 1000) via its 1000->1000 idmap, so no idmap change needed.
    - key: mp1
      value: /home/diwangs/nextcloud,mp=/home/diwangs/nextcloud

# 45drives has a repository but is only for Ubuntu Focal (20.04)
# Thus, we will install them manually instead

cockpit_file_sharing_url: https://github.com/45Drives/cockpit-file-sharing/releases/download/v4.2.8/cockpit-file-sharing_4.2.8-1focal_all.deb
cockpit_identities_url: https://github.com/45Drives/cockpit-identities/releases/download/v0.1.12/cockpit-identities_0.1.12-1focal_all.deb
cockpit_navigator_url: https://github.com/45Drives/cockpit-navigator/releases/download/v0.5.10/cockpit-navigator_0.5.10-1focal_all.deb
