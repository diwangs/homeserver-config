---
# Connection password — actual value lives in the encrypted group_vars/all/vault.yml
ansible_password: "{{ vault_proxmox_password }}"

# community.proxmox 2.0.0 (bundled in ansible 14) requires proxmoxer >= 2.3, but
# Debian 13/PVE 9 APT only ships python3-proxmoxer 2.2. Point Ansible at a uv-built
# venv holding proxmoxer 2.3 (created with --system-site-packages so requests etc.
# stay visible; the venv's proxmoxer shadows the system 2.2). Setup:
#   apt-get install -y python3-pip && pip install --break-system-packages uv
#   uv venv --system-site-packages /opt/ansible-venv
#   uv pip install --python /opt/ansible-venv/bin/python 'proxmoxer>=2.3'
ansible_python_interpreter: /opt/ansible-venv/bin/python

hdparm_devices:
  - dev: /dev/disk/by-id/ata-WDC_WD120EFBX-68B0EN0_D7JEUUGN
    options:
      - "apm = 127"
      # NOTE: a boot-time SATA link reset on ata1 can silently clear this; hd-idle
      # covers this disk too (see hd_idle_devices below).
      - "spindown_time = 240" # 20 mins
  - dev: /dev/disk/by-id/ata-WDC_WD120EFBX-68B0EN0_5QK4975B
    options:
      - "apm = 127"
      # NOTE: this drive's firmware ignores spindown_time (-S) — it never auto-spins
      # down even when freshly set, confirmed across a cold power cycle. apm still
      # applies. Actual spindown is handled by hd-idle (see hd_idle_devices below).
      - "spindown_time = 240"
  - dev: /dev/disk/by-id/ata-WDC_WD120EFBX-68B0EN0_D7J6PRPN
    options:
      - "apm = 127"
      - "spindown_time = 240"

# hd-idle targets: disks whose firmware -S timer can't be relied on and need OS-driven
# spindown via STANDBY IMMEDIATE.
# - 5QK4975B: its auto-standby is permanently dead (obeys hdparm -y, ignores -S,
#   survived a cold power cycle on a clean link).
# - D7JEUUGN (sda/ata1): its port has flaky SATA link errors at boot (interface fatal
#   error, UnrecovData Handshk -> hard reset, link limited to 3.0 Gbps). The COMRESET
#   happens after udev applied hdparm.conf and drops the drive's -S timer back to the
#   power-on default, so it never spins down. hd-idle is immune to that. (The cable or
#   port should still be checked.)
# D7J6PRPN honors the spindown_time above normally and is left to hd-idle's `-i 0` default.
hd_idle_devices:
  - id: ata-WDC_WD120EFBX-68B0EN0_5QK4975B
    idle: 1200 # 20 mins, matches the spindown_time intent for the other disks
  - id: ata-WDC_WD120EFBX-68B0EN0_D7JEUUGN
    idle: 1200

# After usbip is installed, run `usbip list -l` to get the busid
# Serial: Silicon Labs: CP210x UART bridge (careful, it's the same as skyconnect)
digirig_serial_busid: 1-3.2.1
# Soundcard: C-Media Electronics
digirig_soundcard_busid: 1-3.2.2
