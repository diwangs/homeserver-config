---
# LXC definition, consumed on the Proxmox host by roles/host/proxmox_lxc.
proxmox_lxc:
  vmid: 103
  hostname: nextcloud
  # Newest Debian 13 (Trixie), resolved + downloaded by roles/host/proxmox_templates.
  template: debian13
  disk: local-lvm:100 # 100 GB to store actual data
  cores: 2
  # AIO stack: apache + php-fpm + postgres + redis + notify-push + imaginary, with the
  # 07:00 borg backup and auto-update overlapping the live stack. 512 MB let the cgroup
  # OOM killer walk up to dockerd itself on 2026-08-19, which took the whole stack down.
  memory: 1024
  swap: 2048
  netif:
    # dmz
    # ip6=manual: ifupdown only brings eth6 up; systemd-networkd owns addressing
    # (DHCPv6 + RA), deployed host-side via networkd_interfaces below.
    net6: "name=eth6,bridge=vmbr1,tag=6,firewall=1,ip6=manual"
  unprivileged: true # Nextcloud data comes from a shared host mountpoint, not SMB
  features:
    - nesting=1 # Required to run docker
    - fuse=1 # Required for Borg Backup
  # Shared host directory for Nextcloud data, also bind-mounted into the nas
  # container. Owned by `diwangs` (uid 1000) on the host; appears as www-data
  # (uid 33) inside the container via the idmap below.
  host_dirs:
    - path: /home/diwangs/nextcloud
      owner: diwangs
      group: diwangs
      mode: "0770"
  # Map container uid/gid 33 (www-data, required by Nextcloud AIO) to host uid/gid
  # 1000 (`diwangs`), so the shared directory is owned by uid 1000 on the host (and
  # accessed as such by the nas container) while AIO sees its datadir as www-data.
  idmap:
    id: 33
    host_id: 1000
  config_lines:
    - key: mp0
      value: /mnt/frontpanel-pool/frontpanel-dataset/Backup/nextcloud-aio-borg,mp=/mnt/nextcloud-aio-borg
  # systemd-networkd drives links over rtnetlink (no udev), so its DHCPv6 client
  # works in this unprivileged LXC, where both dhcpcd modes failed.
  networkd_interfaces: [eth6]
# roles/common/docker_host. In order for nextcloud-aio to enable IPv6 routing, the default
# bridge gets IPv6 (no ip6tables/NAT66 needed here, unlike frigate/immich).
docker_host_ip6tables: false
docker_host_ipvlan_network:
  name: dmz
  parent: eth6
  subnet: fd5a:715f:1edc:a706::/64
  gateway: fd5a:715f:1edc:a706::1
  iprange: fd5a:715f:1edc:a706::30/124 # 30 - 39
