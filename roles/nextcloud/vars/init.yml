---
# Immutable creation parameters for the Nextcloud/DMZ LXC (vmid 103). Applied once
# by roles/nextcloud/tasks/init_lxc.yml; never reconciled afterwards.
nextcloud_vmid: 103
nextcloud_hostname: nextcloud
# Resolved + downloaded in templates.yml (runs first); newest Debian 13 (Trixie).
# Not compatible with update. Lazily templated, so debian13_template need only be
# registered by the time init_lxc.yml runs (same sentinel-lp play).
nextcloud_ostemplate: "local:vztmpl/{{ debian13_template.stdout }}"
nextcloud_disk: local-lvm:100 # 100 GB to store actual data
nextcloud_netif:
  # dmz
  # ip6=manual: ifupdown only brings eth6 up; systemd-networkd owns addressing
  # (DHCPv6 + RA), configured host-side in init_lxc.yml.
  net6: "name=eth6,bridge=vmbr1,tag=6,firewall=1,ip6=manual"
nextcloud_unprivileged: true # Nextcloud data comes from a shared host mountpoint, not SMB
nextcloud_features:
  - nesting=1 # Required to run docker
  - fuse=1 # Required for Borg Backup
