---
# https://pve.proxmox.com/wiki/Unprivileged_LXC_containers

# Map container uid/gid 33 (www-data, required by Nextcloud AIO) to host uid/gid 1000
# (`diwangs`). This way the shared /home/diwangs/nextcloud directory is owned by uid
# 1000 on the host (and accessed as such by the nas container), while Nextcloud AIO
# inside dockerdmz sees its datadir as www-data.
- name: Passthrough www-data (uid 33) to dockerdmz container
  ansible.builtin.blockinfile:
    path: /etc/pve/lxc/103.conf
    marker: "# {mark} ANSIBLE nextcloud-idmap"
    block: |
      lxc.idmap: u 0 100000 33
      lxc.idmap: g 0 100000 33
      lxc.idmap: u 33 1000 1
      lxc.idmap: g 33 1000 1
      lxc.idmap: u 34 100034 65502
      lxc.idmap: g 34 100034 65502

- name: Allow root to do the mapping
  ansible.builtin.lineinfile:
    path: "/etc/{{ item.path }}"
    line: "{{ item.line }}"
  loop:
    - path: subuid
      line: "root:1000:1"
    - path: subgid
      line: "root:1000:1"
