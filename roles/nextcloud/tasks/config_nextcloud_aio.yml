---
- name: Create Nextcloud container(s)
  community.docker.docker_container:
    name: nextcloud-aio-mastercontainer # hardcoded, don't change
    image: nextcloud/all-in-one:latest
    restart_policy: always
    state: started
    # Define the address for the mastercontainer (ULA only).
    # This does not affect the Nextcloud AIO sub-containers, since they create
    # their own bridge (and does not touch the ipvlan at all). They will be
    # reachable by the fact that the Apache sub-container will bind to the LXC's
    # [::]:443, which has a GUA and ULA.
    networks:
      - name: dmz
        ipv6_address: fd5a:715f:1edc:a706::30   # Part of the ipvlan
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config # hardcoded, don't change
    env:
      SKIP_DOMAIN_VALIDATION: "true" # Domain validation is intended if the IP address of AIO and Nextcloud is the same
      NEXTCLOUD_DATADIR: "/mnt/lvm-nextcloud"
      # actual storage files are stored in `<user>/files/`

# Steps
# 1. Disable domain validation
# 2. Add DNS entry manually
# 3. Restart containers

# If mastercontainer address in the web mismatches, inspect the correct address,
# change them while keeping the ref token, and restart the containers.
