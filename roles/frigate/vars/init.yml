---
# Immutable creation parameters for the Frigate/Docker LXC (vmid 102). Applied once
# by roles/frigate/tasks/init_lxc.yml; never reconciled afterwards.
frigate_vmid: 102
frigate_hostname: frigate
# TODO: make sure the template exist first?
# Not compatible with update
frigate_ostemplate: local:vztmpl/debian-12-standard_12.7-1_amd64.tar.zst
frigate_disk: local-lvm:16 # 16 GB
# frigate_netif moved to config.yml: it's now reconciled onto the live container
# (config_resources.yml, update: true) so the DMZ NIC can be added without a
# rebuild. Container restart is required for netif changes to take effect.
frigate_unprivileged: false # Required for passing GPU
frigate_features:
  - nesting=1 # Required to run docker
