---
# Mutable in-tenant config: the Docker application stack. Re-runnable; driven by
# configure.yml.

# Setup caddy server to handle IPv6 of IPv4 only services (like frigate)
- name: Set up caddy
  ansible.builtin.include_tasks: config_caddy.yml
- name: Set up storage
  ansible.builtin.include_tasks: config_setup_storage.yml
- name: Set up Portainer
  ansible.builtin.include_tasks: config_portainer.yml
- name: Set up Frigate
  ansible.builtin.include_tasks: config_frigate.yml
# Watchtower is available but not currently enabled:
# - ansible.builtin.include_tasks: config_watchtower.yml
