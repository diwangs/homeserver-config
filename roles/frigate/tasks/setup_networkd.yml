---
# Host-side (pct exec) systemd-networkd addressing for the Frigate LXC's interfaces.
# Included at both init (init_lxc.yml) and reconcile (config_lxc.yml).
#
# eth3/eth6 use ip6=manual: ifupdown only brings the links up, so networkd owns
# addressing. It must be driven host-side (pct exec) rather than over SSH, because
# the guest has no address until networkd runs — a bootstrap catch-22 for the
# SSH-based docker layer. networkd processes RAs in userspace and installs the
# default route itself, covering this Docker/forwarding host (the kernel ignores RAs
# while forwarding — github.com/docker/for-linux/issues/844). Proxmox never touches
# /etc/systemd/network, so these files survive the interfaces-file regeneration.
#
# Addressing is DHCPv6 + RA only (no static Address=), matching the Nextcloud DMZ
# LXC. The ::22 management address (inventory ansible_host) and the GUA come from
# the router's DHCPv6 reservation, keyed to this guest's DUID + per-interface IAID.
# eth4 is ip4=dhcp, so ifupdown handles it — only the ip6=manual links need networkd.
# Kept as separate tasks (not a loop) so each can use the registered-result
# `changed_when` idiom that works reliably in ansible-core (a looped task doesn't
# expose bare `stdout` to changed_when).
- name: Deploy systemd-networkd config for eth3 (backend)
  ansible.builtin.command:
    cmd: >
      pct exec {{ frigate_vmid }} -- sh -c
      'n="[Match]\nName=eth3\n\n[Network]\nDHCP=ipv6\nIPv6AcceptRA=yes\n";
      printf "$n" | cmp -s - /etc/systemd/network/eth3.network ||
      { printf "$n" > /etc/systemd/network/eth3.network; echo changed; }'
  register: frigate_networkd_eth3
  changed_when: "'changed' in frigate_networkd_eth3.stdout"
  notify: Reload networkd in Docker LXC

- name: Deploy systemd-networkd config for eth6 (dmz)
  ansible.builtin.command:
    cmd: >
      pct exec {{ frigate_vmid }} -- sh -c
      'n="[Match]\nName=eth6\n\n[Network]\nDHCP=ipv6\nIPv6AcceptRA=yes\n";
      printf "$n" | cmp -s - /etc/systemd/network/eth6.network ||
      { printf "$n" > /etc/systemd/network/eth6.network; echo changed; }'
  register: frigate_networkd_eth6
  changed_when: "'changed' in frigate_networkd_eth6.stdout"
  notify: Reload networkd in Docker LXC

- name: Enable systemd-networkd in Docker LXC
  ansible.builtin.command:
    cmd: pct exec {{ frigate_vmid }} -- systemctl enable --now systemd-networkd.socket systemd-networkd.service
  register: frigate_networkd_enable
  changed_when: "'Created symlink' in frigate_networkd_enable.stderr"
