---
# Reconcile mutable LXC resources onto the live Frigate/Docker container. Runs on
# the Proxmox host (configure.yml); `update: true` updates an existing container.
- name: Load Docker resource parameters
  ansible.builtin.include_vars: "{{ item }}"
  loop:
    - init.yml # for frigate_vmid
    - config.yml

# cores/memory/swap hot-apply, no restart needed — keep them in their own call so
# resizing the container doesn't bounce Frigate.
- name: Reconcile Docker LXC resources
  community.proxmox.proxmox:
    api_host: "{{ proxmox_host }}"
    api_user: "{{ proxmox_user }}"
    api_password: "{{ proxmox_password }}"
    node: "{{ proxmox_host }}"
    vmid: "{{ frigate_vmid }}"
    # hostname is immutable, but the proxmox module requires it whenever
    # state=present (the default) — pass it through unchanged.
    hostname: "{{ frigate_hostname }}"
    cores: "{{ frigate_cores }}"
    memory: "{{ frigate_memory }}"
    swap: "{{ frigate_swap }}"
    update: true

# netif is reconciled here (not just at create) so the DMZ NIC (net6) can be added
# without rebuilding the container. Kept separate from the resize above so the
# restart it requires (via handler) is gated on a real NIC change only.
- name: Reconcile Docker LXC network interfaces
  community.proxmox.proxmox:
    api_host: "{{ proxmox_host }}"
    api_user: "{{ proxmox_user }}"
    api_password: "{{ proxmox_password }}"
    node: "{{ proxmox_host }}"
    vmid: "{{ frigate_vmid }}"
    hostname: "{{ frigate_hostname }}"
    netif: "{{ frigate_netif }}"
    update: true
  notify: Restart Docker LXC

# (Re)deploy the in-guest addressing for eth3/eth6. Ensures a newly-added eth6 gets
# its .network file; on a netif change the queued LXC restart applies it on boot.
- name: Set up systemd-networkd addressing
  ansible.builtin.include_tasks: setup_networkd.yml

# Apply the netif restart + any networkd reload now, before the later SSH-based
# docker layer (config_docker.yml) needs the guest reachable at ::22.
- name: Apply pending network changes
  ansible.builtin.meta: flush_handlers
