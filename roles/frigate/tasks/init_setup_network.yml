---
# Note: eth3/eth6 addressing (static ULA + DHCPv6/RA) is owned by systemd-networkd,
# configured host-side in roles/frigate/tasks/setup_networkd.yml. networkd processes
# RAs in userspace and installs the default route itself, so it handles this Docker/
# forwarding host without the old `accept_ra=2` sysctl workaround (the kernel ignores
# RAs while forwarding — github.com/docker/for-linux/issues/844).

# Frigate moved off host networking to a bridge with per-host-IP published ports
# (WebRTC media on the DMZ, everything else on backend). NAT66 requires Docker's
# ip6tables and an IPv6-enabled bridge. Mirrors the Nextcloud daemon.json.
- name: Enable IPv6 + ip6tables (NAT66) for Docker bridges
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "ip6tables": true,
        "default-network-opts": {"bridge": {"com.docker.network.enable_ipv6": "true"}}
      }
- name: Restart Docker after daemon.json change
  ansible.builtin.service:
    name: docker
    state: restarted

# Dedicated bridge for the Frigate container. The internal ULA is NAT66'd to the
# host; reachability is via the published ports bound to the host's eth3/eth6 ULAs.
- name: Create Docker bridge network for Frigate
  community.docker.docker_network:
    name: frigate-net
    enable_ipv6: true
    driver: bridge
    ipam_config:
      - subnet: fd00:f81a:7e::/64 # container-internal, NAT66'd to host

# We use ipvlan for the Docker network, which offers these advantages:
# 1. Unlike bridge, it doesn't do address translation, which is not necessary
#   for IPv6. Because it doesn't do address translation, each container is able
#   to own an IP address and is routable.
# 2. As a result, it's not necessary to do port mapping too.
# 3. (Nit) Less pressure on the switch compared to macvlan.
#
# While technically supports VLAN, it seems to have problem with nested VLAN
# of LXC?
#
# The only disadvantage is that it doesn't integrate with the router's DHCPv6
# and RA in general, which means it doesn't support dynamic prefix for globally
# routable address. Miraculously, even if each container doesn't have a
# globally routable address they can still communicate with the outside world,
# as long as the parent interface has a globally routable address (e.g., eth0)
# ADDED: globally routable only if SLAAC is enabled

# To create another VLAN, create new interface first

- name: Create Docker ipvlan network for backend VLAN
  community.docker.docker_network:
    name: backend
    enable_ipv6: true
    driver: ipvlan
    driver_options:
      parent: eth3
    ipam_config:
      - subnet: fd5a:715f:1edc:a703::/64
        gateway: fd5a:715f:1edc:a703::1
        iprange: fd5a:715f:1edc:a703::30/124 # 30 - 39

# Note on bridges:
#
# Some setup (e.g., Nextcloud AIO) assumes bridge network, which rely on the
# host address. This could be problematic if we only want to publicly expose
# some services. Our current solution is just to use the backend network and
# adjust firewall manually.
