---
# Host-level ZFS setup for sentinel-lp (create_zfs_user -> tzpfms ->
# create_zfs_load_key). Applied by playbooks/init_proxmox.yml.

# --- Create ZFS user ---
- name: Create user that owns the file on the drive
  ansible.builtin.user:
    name: diwangs
    uid: 1000 # Important!
    password: "{{ proxmox_password | password_hash('sha512') }}"
    shell: /bin/bash
    update_password: on_create

# --- Set up tzpfms ---
- name: Add `nabijaczleweli`'s gpg key
  ansible.builtin.get_url:
    url: https://debian.nabijaczleweli.xyz/nabijaczleweli.gpg.key
    dest: /etc/apt/keyrings/nabijaczleweli.asc
    mode: "0644"

# Commented, since we built our own
# - name: Add `nabijaczleweli`'s Debian bookworm repository
#   ansible.builtin.apt_repository:
#     repo: deb [signed-by=/etc/apt/keyrings/nabijaczleweli.asc] https://debian.nabijaczleweli.xyz bookworm main
#     state: present

- name: Install `tzpfms`
  ansible.builtin.apt:
    name: tzpfms-tpm2
    state: present
    update_cache: true

# --- Create ZFS load key ---
# Create zfs-load-key instance for each encrypted dataset
- name: Create cache directory
  ansible.builtin.file:
    path: /etc/zfs/zfs-list.cache
    state: directory
    mode: "0755"

- name: Create cache file
  ansible.builtin.file:
    path: /etc/zfs/zfs-list.cache/frontpanel-pool
    modification_time: preserve
    access_time: preserve
    state: touch
    mode: "0644"

- name: Enable and start `zed` service
  ansible.builtin.systemd_service:
    name: zfs-zed
    enabled: true
    state: started
    masked: false

# The pool root dataset stores no data of its own (data + the TPM-bound key live in
# frontpanel-dataset); keep it from mounting at /frontpanel-pool so it stays a purely
# structural/property anchor for the tree.
- name: Keep the pool root dataset unmounted
  community.general.zfs:
    name: frontpanel-pool
    state: present
    extra_zfs_properties:
      canmount: "off"

# TODO: is this going to call `zfs set`?
- name: Trigger load-key generation by updating cache
  community.general.zfs:
    name: frontpanel-pool/frontpanel-dataset
    state: present
    extra_zfs_properties:
      canmount: "on"
      mountpoint: /mnt/frontpanel-pool/frontpanel-dataset

# TODO: a restart must happen before the key is loaded
