---
# Host-level hd-idle setup for sentinel-lp. The 5QK4975B drive's firmware ignores the
# ATA standby timer (hdparm -S): it accepts the command but never spins down, even
# after a cold power cycle on a clean SATA link. It DOES honor STANDBY IMMEDIATE
# (hdparm -y), which is exactly what hd-idle issues after watching /proc/diskstats go
# idle. Scoped to the disks in `hd_idle_devices` only (global default `-i 0`); the
# other pool members keep using their working geerlingguy.hdparm `-S` timer.
# See host_vars/sentinel-lp.yml for the device list and the diagnosis. Applied by
# playbooks/configure.yml.

- name: Install hd-idle
  ansible.builtin.apt:
    name: hd-idle
    state: present
    update_cache: true

# The deployed header below still names the pre-refactor path (roles/hd-idle.yml);
# it is left as is because changing it would rewrite the file and restart hd-idle.
- name: Configure hd-idle (spin down only the listed disks)
  ansible.builtin.copy:
    dest: /etc/default/hd-idle
    mode: "0644"
    content: |
      # Managed by Ansible (roles/hd-idle.yml) — do not edit by hand.
      # -i 0 disables spindown for every disk except those named with -a, so this
      # only ever touches the disks listed in `hd_idle_devices`.
      START_HD_IDLE=true
      HD_IDLE_OPTS="-i 0 -s 1{% for d in hd_idle_devices %} -a /dev/disk/by-id/{{ d.id }} -i {{ d.idle }}{% endfor %}"
  notify: Restart hd-idle to apply configuration changes

# The package auto-starts hd-idle on install while /etc/default/hd-idle still has its
# shipped START_HD_IDLE=false, so the unit (Restart=always) crash-loops to a
# start-limit-hit before our config lands. Clear that state before starting.
- name: Clear any start-limit state left by the package's install-time start
  ansible.builtin.command: systemctl reset-failed hd-idle.service
  changed_when: false
  failed_when: false

- name: Enable and start hd-idle service
  ansible.builtin.systemd:
    name: hd-idle
    enabled: true
    state: started

- name: Apply pending hd-idle configuration changes
  ansible.builtin.meta: flush_handlers
