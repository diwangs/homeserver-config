---
- name: Validate the OpenWrt target
  ansible.builtin.import_tasks: validate.yml

- name: Install router packages
  ansible.builtin.import_tasks: packages.yml

- name: Configure router authentication
  ansible.builtin.import_tasks: auth.yml

- name: Configure non-UCI router files
  ansible.builtin.import_tasks: files.yml

- name: Reconcile UCI configuration
  ansible.builtin.import_tasks: uci.yml

- name: Reconcile router services
  ansible.builtin.import_tasks: services.yml
