---
# Reconcile the running Home Assistant guest (CT113). Runs in-guest via `pct exec` through
# the Proxmox host (group_vars/tenant_lxc.yml), from playbooks/configure.yml.
#
# Same shape as roles/tenant/dav: one flake tree and one `nixos-rebuild`; the same tree
# built the image (tasks/build_template.yml). The Docker engine and the homeassistant
# container (virtualisation.oci-containers) live in files/nixos/configuration.nix.
#
# /config is NOT created here: it came from HAOS once and is restored from a backup on a
# rebuilt guest, then the marker that lets the container start is written (README). HA's users, auth tokens and integration
# credentials live in /config/.storage, so this role holds no secrets.
#
# No Portainer: this guest is publicly reachable (through the edge) and Portainer would
# add an admin surface holding the Docker socket.
- name: Validate Home Assistant inputs
  ansible.builtin.import_tasks: validate.yml

- name: Deploy the Home Assistant NixOS configuration
  ansible.builtin.import_tasks: nixos.yml

- name: Start Home Assistant
  ansible.builtin.import_tasks: stack.yml
