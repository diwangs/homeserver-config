---
# The container may only start once a real /config is in place and the marker written
# (its unit carries the same condition, so a reboot of a fresh guest stays quiet).
- name: Check whether /config has been put in place
  ansible.builtin.stat:
    path: "{{ hass_migrated_marker }}"
  register: hass_migrated

- name: Report that Home Assistant is waiting for its /config
  ansible.builtin.debug:
    msg: >-
      {{ hass_migrated_marker }} is missing: Home Assistant stays stopped until /config is
      restored and the marker written (roles/tenant/hass/README.md, "Restoring").
  when: not hass_migrated.stat.exists

# nixos-rebuild restarts the unit itself when its definition (e.g. the image pin) changed.
- name: Start Home Assistant
  ansible.builtin.systemd_service:
    name: docker-homeassistant.service
    state: started
  when: hass_migrated.stat.exists
