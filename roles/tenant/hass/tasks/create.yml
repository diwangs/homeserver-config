---
# Immutable provisioning of the Home Assistant VM. Runs on the Proxmox host
# (playbooks/init_proxmox.yml); create-once. Mutable resources are owned by
# reconcile.yml — read here only to size the VM at creation time.
- name: Create VM for Home Assistant without the disk
  community.proxmox.proxmox_kvm:
    api_host: "{{ proxmox_host }}"
    api_user: "{{ proxmox_user }}"
    vmid: "{{ hass_vmid }}"
    name: "{{ hass_name }}"
    machine: "{{ hass_machine }}"
    ostype: "{{ hass_ostype }}"
    bios: "{{ hass_bios }}"
    efidisk0: "{{ hass_efidisk0 }}"
    sockets: "{{ hass_sockets }}"
    cores: "{{ hass_cores }}"
    memory: "{{ hass_memory }}"
    net: "{{ hass_net }}"
    scsihw: "{{ hass_scsihw }}"
    usb: "{{ hass_usb }}"
    agent: "{{ hass_agent }}"
    onboot: true

- name: Check if disk 1 exists
  ansible.builtin.shell: "qm config {{ hass_vmid }} | grep 'scsi0: local-lvm:vm-{{ hass_vmid }}-disk-1'"
  register: hass_disk1_exists
  changed_when: false
  ignore_errors: true

# We manually download and extract instead of using unarchive because it only
# supports .tar.gz and .zip files (not standalone .xz files)
- name: Download Home Assistant OVA
  ansible.builtin.get_url:
    url: "{{ haos_url }}"
    dest: /tmp/haos_ova.qcow2.xz
    mode: "0644"
  when: hass_disk1_exists is failed

- name: Uncompress Home Assistant OVA
  ansible.builtin.command:
    cmd: "unxz /tmp/haos_ova.qcow2.xz"
  changed_when: true
  when: hass_disk1_exists is failed

- name: Import OVA disk to VM
  ansible.builtin.command:
    cmd: "qm importdisk {{ hass_vmid }} /tmp/haos_ova.qcow2 local-lvm"
  changed_when: true
  when: hass_disk1_exists is failed

- name: Remove extracted file
  ansible.builtin.file:
    path: /tmp/haos_ova.qcow2
    state: absent
  when: hass_disk1_exists is failed

# Edit scsi0 to be discard and set as boot disk
- name: Add disk as scsi0
  ansible.builtin.command:
    # disk-0 is for EFI
    cmd: "qm set {{ hass_vmid }} --scsi0 local-lvm:vm-{{ hass_vmid }}-disk-1,discard=on --boot c --bootdisk scsi0"
  changed_when: true
  when: hass_disk1_exists is failed

# NOTE: IPv4 needs to be enabled for setup to work
# It could be disabled after setup
