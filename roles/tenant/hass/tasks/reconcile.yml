---
# Reconcile mutable resources onto the live Home Assistant VM. Runs on the Proxmox
# host (playbooks/configure.yml); `update: true` updates an existing VM.
- name: Reconcile Home Assistant VM resources
  community.proxmox.proxmox_kvm:
    api_host: "{{ proxmox_host }}"
    api_user: "{{ proxmox_user }}"
    vmid: "{{ hass_vmid }}"
    cores: "{{ hass_cores }}"
    memory: "{{ hass_memory }}"
    update: true
