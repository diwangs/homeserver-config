---
# Broker logins. Root-only files outside the flake tree: everything a Nix expression
# touches lands in /nix/store, which is world-readable, so configuration.nix only names
# these paths (LoadCredential) and never reads them. The directory is also created by
# systemd.tmpfiles in the image.
- name: Ensure the IoT secrets directory exists
  ansible.builtin.file:
    path: "{{ iot_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# One line, no newline at the end: the module rejects multi-line password files.
- name: Install the broker passwords
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ iot_secrets_dir }}/mqtt-{{ item.key }}"
    owner: root
    group: root
    mode: "0400"
  loop: "{{ iot_mqtt_passwords | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: iot_mqtt_secrets
  no_log: true
