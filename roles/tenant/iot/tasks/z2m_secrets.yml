---
# Zigbee2MQTT resolves `!secret <key>` from secret.yaml in its data directory. Owned by
# its user: Z2M rewrites a referenced value there when it changes one (e.g. the frontend
# token from its UI). The rebuild created the user and, via the module, the directory.
- name: Ensure the Zigbee2MQTT data directory exists
  ansible.builtin.file:
    path: "{{ iot_z2m_dir }}"
    state: directory
    owner: zigbee2mqtt
    group: zigbee2mqtt
    mode: "0700"

- name: Install the Zigbee2MQTT secrets
  ansible.builtin.template:
    src: secret.yaml.j2
    dest: "{{ iot_z2m_dir }}/secret.yaml"
    owner: zigbee2mqtt
    group: zigbee2mqtt
    mode: "0600"
  register: iot_z2m_secrets
  no_log: true
