---
# Apply a Caddyfile change. Notified from caddy.yml and flushed there (before the
# Frigate container is created) so Caddy re-binds off 0.0.0.0:5000 onto the ULA,
# freeing 127.0.0.1:5000 for Frigate's published port. A full restart (not reload)
# guarantees the old all-interfaces listener is torn down first.
- name: Restart caddy
  ansible.builtin.service:
    name: caddy
    state: restarted

# Frigate reads /config/config.yaml only at startup. Restarting the existing container
# (rather than recreating it) keeps it on the same image and mounts.
- name: Restart Frigate
  ansible.builtin.command: docker restart frigate
  changed_when: true
