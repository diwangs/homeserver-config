---
# Frigate's config lives on the CIFS share (/mnt/frigate/config, the container's /config)
# but is owned by this repo: UI edits are overwritten here. A changed config restarts
# Frigate (handler), since Frigate only reads it at startup.
- name: Render the Frigate config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /mnt/frigate/config/config.yaml
    mode: "0660"
    backup: true
  no_log: true
  notify: Restart Frigate

- name: Create Frigate container
  community.docker.docker_container:
    name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.18.2
    restart_policy: always
    shm_size: 82M # Recommended?
    state: started
    networks:
      - name: frigate-net # bridge + NAT66; per-port host binding splits the VLANs
    # Per-host-IP published ports keep each service on the right VLAN:
    #   - 5000 (unauth UI) on IPv4 loopback only; reached via Caddy (IPv6->IPv4).
    #   - 8971 (auth UI) on IPv4 loopback only: Frigate's nginx is IPv4-only inside
    #     the container, so it can't be published on the IPv6 backend (docker-proxy
    #     would forward to the container's IPv6, where nothing listens). Left local.
    #   - 8554/1984 (go2rtc, IPv6-capable inside) on the backend (VLAN 3) ULA ::22.
    #   - 8555 WebRTC media on all IPv6 interfaces ([::], not 0.0.0.0, which would
    #     only land on eth4's IPv4). Kept off the backend by a PVE firewall rule
    #     dropping 8555 on eth3. Nothing forwards it from the internet: LAN clients
    #     use the dmz ULA directly (UDP or TCP), and remote clients reach it over TCP
    #     via the BunkerWeb edge (CT110, frigate-webrtc.us), which relays
    #     8555/tcp to this guest's dmz ULA.
    # WebRTC ICE candidates must be set in Frigate's go2rtc config (on the mounted
    # /config volume) to the DMZ ULA and frigate-webrtc.us (a CNAME to the edge) —
    # the container can't observe either address behind NAT. See README.md.
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:8971:8971"
      - "[fd5a:715f:1edc:a703::22]:8554:8554"
      - "[fd5a:715f:1edc:a703::22]:1984:1984"
      - "[::]:8555:8555/udp" # All interface (including GUA), use firewall
      - "[::]:8555:8555/tcp"
    volumes:
      - frigate_data:/data # For frigate.db to let disk spindown
      - /mnt/frigate/config:/config
      - /mnt/frigate/recordings:/media/frigate/recordings
      - /mnt/frigate/clips:/media/frigate/clips
      - /mnt/frigate/exports:/media/frigate/exports
    mounts:
      - type: tmpfs
        target: /tmp/cache
        tmpfs_size: 1G
    devices:
      - "/dev/dri/renderD128:/dev/dri/renderD128:rwm"
    capabilities:
      - PERFMON

# NOTE: In order to integrate with hass, change the admin password first
