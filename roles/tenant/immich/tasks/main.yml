---
# Mutable in-tenant config: the Docker application stack. Re-runnable; driven by
# playbooks/configure.yml. The Docker engine and networks come from
# roles/common/docker_host (playbooks/init_tenant.yml).
#
# Storage is not mounted here: the upload dir is a host bind-mount (/mnt/immich),
# provided at the LXC level (see host_vars/immich.yml).
- name: Set up Portainer
  ansible.builtin.include_role:
    name: portainer
  vars:
    portainer_network: backend
    portainer_ipv6_address: fd5a:715f:1edc:a703::40 # Part of the ipvlan (40 - 4f)

- name: Set up Immich
  ansible.builtin.import_tasks: immich.yml
