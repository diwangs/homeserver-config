---
# Mutable in-tenant config: the Docker application stack. Re-runnable; driven by
# playbooks/configure.yml. The Docker engine and networks come from
# roles/common/docker_host (playbooks/init_tenant.yml).
#
# Storage is not mounted here: the Nextcloud datadir is a host bind-mount provided
# at the LXC level (see host_vars/nextcloud.yml).
- name: Set up Portainer
  ansible.builtin.include_role:
    name: portainer
  vars:
    portainer_network: dmz
    portainer_ipv6_address: fd5a:715f:1edc:a706::31 # Part of the ipvlan

- name: Set up Nextcloud AIO
  ansible.builtin.import_tasks: nextcloud_aio.yml
