---
# The only place credentials reach the guest. A root-only file outside the flake tree:
# everything a Nix expression touches lands in /nix/store, which is world-readable, so
# configuration.nix references it by plain string path (a bind mount) and never reads
# it. The directory is also created by systemd.tmpfiles in the image.
- name: Ensure the Radicale secrets directory exists
  ansible.builtin.file:
    path: "{{ dav_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Whether the file existed before this run tells tasks/stack.yml "credentials changed on
# a running container" (restart) from "first install" (just start).
- name: Check for an existing users file
  ansible.builtin.stat:
    path: "{{ dav_secrets_dir }}/users"
  register: dav_users_before

# 0444 inside a 0700 root directory: the container's non-root user (host-mapped uid)
# cannot traverse the directory, so the file is bind-mounted from a root-only path and
# only needs to be world-readable once inside the container.
- name: Install the users file
  ansible.builtin.template:
    src: users.j2
    dest: "{{ dav_secrets_dir }}/users"
    owner: root
    group: root
    mode: "0444"
  register: dav_users
  no_log: true
