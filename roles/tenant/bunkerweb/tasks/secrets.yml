---
# The only place credentials reach the guest. A root-only file outside the flake tree:
# everything a Nix expression touches lands in /nix/store, which is world-readable,
# so configuration.nix references it by plain string path (`docker run --env-file`)
# and never reads it. The directory is also created by systemd.tmpfiles in the image.
- name: Ensure the BunkerWeb secrets directory exists
  ansible.builtin.file:
    path: "{{ bunkerweb_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Whether the file existed before this run tells tasks/stack.yml "credential changed on
# a running stack" (restart) from "first install" (just start).
- name: Check for an existing scheduler environment file
  ansible.builtin.stat:
    path: "{{ bunkerweb_secrets_dir }}/scheduler.env"
  register: bunkerweb_scheduler_env_before

- name: Install the scheduler environment file
  ansible.builtin.template:
    src: scheduler.env.j2
    dest: "{{ bunkerweb_secrets_dir }}/scheduler.env"
    owner: root
    group: root
    mode: "0400"
  register: bunkerweb_scheduler_env
  no_log: true

# The web UI's admin login, seeded when the UI first starts. A changed file restarts the UI.
- name: Check for an existing UI environment file
  ansible.builtin.stat:
    path: "{{ bunkerweb_secrets_dir }}/ui.env"
  register: bunkerweb_ui_env_before

- name: Install the UI environment file
  ansible.builtin.template:
    src: ui.env.j2
    dest: "{{ bunkerweb_secrets_dir }}/ui.env"
    owner: root
    group: root
    mode: "0400"
  register: bunkerweb_ui_env
  no_log: true
