---
# Invoked by roles/host/proxmox_lxc (template_role in host_vars) right before the
# container is created; sets proxmox_lxc_built_template, the uploaded filename.
#
# CT107 already has the pinned Hermes closure in its Nix store. Build there to
# reuse it; CT108 still receives a prebuilt image and stays at 2 GiB RAM.
- name: Create temporary gateway flake build directory
  ansible.builtin.tempfile:
    state: directory
    suffix: hermes-gateway-nixos
  register: hermes_gateway_build_dir
  delegate_to: hermes
  changed_when: false

- name: Stage shared Hermes flake tree
  ansible.builtin.copy:
    src: "{{ role_path }}/../hermes/files/nixos/"
    dest: "{{ hermes_gateway_build_dir.path }}/"
    mode: "0644"
  delegate_to: hermes
  changed_when: false

# site.nix carries the public identity (domains, Matrix IDs, ACME contact) from
# the vault; it is not committed, so it is rendered beside the static tree.
- name: Render the public identity module
  ansible.builtin.template:
    src: "{{ role_path }}/../hermes/templates/site.nix.j2"
    dest: "{{ hermes_gateway_build_dir.path }}/site.nix"
    mode: "0644"
  delegate_to: hermes
  changed_when: false

- name: Build gateway LXC image on CT107
  ansible.builtin.command:
    cmd: >-
      nix build --no-update-lock-file --no-link --print-out-paths
      "path:{{ hermes_gateway_build_dir.path }}#packages.x86_64-linux.gateway-proxmox-lxc"
  register: hermes_gateway_nix_build
  delegate_to: hermes
  changed_when: false

- name: Locate gateway LXC tarball
  ansible.builtin.find:
    paths: "{{ hermes_gateway_nix_build.stdout_lines | last }}"
    patterns: "*.tar.xz"
    recurse: true
  register: hermes_gateway_tarball
  delegate_to: hermes
  changed_when: false
  failed_when: hermes_gateway_tarball.files | length != 1

- name: Derive gateway template filename
  ansible.builtin.set_fact:
    hermes_gateway_template_version: >-
      {{ hermes_gateway_tarball.files[0].path | basename
         | regex_replace('^nixos-image-lxc-proxmox-(.+)-[^-]+-linux\.tar\.xz$', '\1') }}
    hermes_gateway_template_build: >-
      {{ (hermes_gateway_nix_build.stdout_lines | last | basename).split('-') | first | truncate(8, true, '') }}

- name: Set gateway template filename
  # proxmox_lxc_built_template is the contract with roles/host/proxmox_lxc, hence its prefix.
  ansible.builtin.set_fact: # noqa: var-naming[no-role-prefix]
    proxmox_lxc_built_template: "nixos-hermes-gateway_{{ hermes_gateway_template_version }}.{{ hermes_gateway_template_build }}_amd64.tar.xz"
  failed_when: hermes_gateway_template_version == (hermes_gateway_tarball.files[0].path | basename)

- name: Fetch gateway template to workstation
  ansible.builtin.fetch:
    src: "{{ hermes_gateway_tarball.files[0].path }}"
    dest: "/tmp/{{ proxmox_lxc_built_template }}"
    flat: true
  delegate_to: hermes

- name: Upload gateway template to Proxmox
  ansible.builtin.copy:
    src: "/tmp/{{ proxmox_lxc_built_template }}"
    dest: "/var/lib/vz/template/cache/{{ proxmox_lxc_built_template }}"
    mode: "0644"
    owner: root
    group: root

- name: Remove temporary gateway flake build directory
  ansible.builtin.file:
    path: "{{ hermes_gateway_build_dir.path }}"
    state: absent
  delegate_to: hermes
  changed_when: false

- name: Remove temporary gateway tarball from workstation
  ansible.builtin.file:
    path: "/tmp/{{ proxmox_lxc_built_template }}"
    state: absent
  delegate_to: localhost
  changed_when: false
