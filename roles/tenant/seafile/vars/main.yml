---
# Secrets come from the encrypted group_vars/all/vault.yml (names below). None of
# them has a default: tasks/validate.yml fails the play before touching the guest
# when one is missing or too weak. The `default('')` only lets that assert report
# every missing name at once instead of erroring on the first undefined variable.
seafile_db_password: "{{ vault_seafile_db_password | default('') }}"
seafile_db_root_password: "{{ vault_seafile_db_root_password | default('') }}"
seafile_jwt_private_key: "{{ vault_seafile_jwt_private_key | default('') }}"
seafile_admin_email: "{{ vault_seafile_admin_email | default('') }}"
seafile_admin_password: "{{ vault_seafile_admin_password | default('') }}"

# Keep in step with the mp0/mp1 lines in host_vars/seafile.yml.
seafile_data_dir: /mnt/seafile
seafile_backup_dir: /mnt/seafile-backup
