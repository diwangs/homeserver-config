---
# The only place credentials reach the guest. Root-only files outside the flake tree:
# everything a Nix expression touches lands in /nix/store, which is world-readable,
# so configuration.nix references these by plain string path (`docker run --env-file`)
# and never reads them. The directory is also created by systemd.tmpfiles in the image.
- name: Ensure the Seafile secrets directory exists
  ansible.builtin.file:
    path: "{{ seafile_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Whether a file existed before this run tells tasks/stack.yml "credentials changed on a
# running stack" (restart) from "first install" (just start).
- name: Check for an existing MariaDB environment file
  ansible.builtin.stat:
    path: "{{ seafile_secrets_dir }}/mysql.env"
  register: seafile_mysql_env_before

- name: Check for an existing Seafile server environment file
  ansible.builtin.stat:
    path: "{{ seafile_secrets_dir }}/seafile.env"
  register: seafile_server_env_before

- name: Install the MariaDB environment file
  ansible.builtin.template:
    src: mysql.env.j2
    dest: "{{ seafile_secrets_dir }}/mysql.env"
    owner: root
    group: root
    mode: "0400"
  register: seafile_mysql_env
  no_log: true

- name: Install the Seafile server environment file
  ansible.builtin.template:
    src: seafile.env.j2
    dest: "{{ seafile_secrets_dir }}/seafile.env"
    owner: root
    group: root
    mode: "0400"
  register: seafile_server_env
  no_log: true
