---
# Host-level usbip setup for sentinel-lp (digirig passthrough). Merged from the
# former usbip_host role; the systemd unit is now written inline via copy (its
# `content` is Jinja-templated, so the busid vars render as before). Disabled by
# default — see the commented import in init_proxmox.yml.

- name: Install usbip from apt repository
  ansible.builtin.apt:
    name: usbip
    state: present
    update_cache: true

- name: Add usbip kernel module
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - usbip_core
    - usbip_host

- name: Create usbip systemd service for digirig
  ansible.builtin.copy:
    dest: /lib/systemd/system/usbip.service
    mode: "0644"
    content: |
      [Unit]
      Description=USB/IP Daemon
      After=network.target

      [Service]
      Type=forking
      ExecStart=/usr/sbin/usbipd -D
      ExecStartPost=/bin/sh -c "/usr/sbin/usbip bind --busid={{ digirig_serial_busid }}; /usr/sbin/usbip bind --busid={{ digirig_soundcard_busid }}"
      ExecStop=/bin/sh -c "/usr/sbin/usbip unbind --busid={{ digirig_serial_busid }}; \
        /usr/sbin/usbip unbind --busid={{ digirig_soundcard_busid }}; killall usbipd"

      [Install]
      WantedBy=multi-user.target

# If the USB device isn't detected, this will get an error
- name: Enable and start usbipd service
  ansible.builtin.systemd:
    name: usbip
    enabled: true
    state: started
