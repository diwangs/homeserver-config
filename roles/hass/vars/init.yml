---
# Immutable creation parameters for the Home Assistant VM (vmid 200, KVM). Applied
# once by roles/hass/tasks/init_kvm.yml; never reconciled afterwards.
hass_vmid: 200
hass_name: hass
hass_machine: q35
hass_ostype: l26
hass_bios: ovmf
hass_efidisk0:
  storage: local-lvm
  efitype: 4m
  format: raw
  pre_enrolled_keys: false
hass_sockets: 1
hass_net:
  # Backend VLAN, because we need to connect to IoT and stuffs
  net0: virtio,bridge=vmbr1,tag=3,firewall=1
hass_scsihw: virtio-scsi-single
hass_usb:
  usb0: "host={{ skyconnect_busid }}"
