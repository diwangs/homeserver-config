---
# Immutable creation parameters for the NAS LXC (vmid 100). Changing any of these
# requires recreating the container — they are applied once by
# roles/nas/tasks/init_lxc.yml and never reconciled afterwards.
nas_vmid: 100
nas_hostname: nas
# TODO: make sure the template exist first?
nas_ostemplate: local:vztmpl/debian-12-standard_12.7-1_amd64.tar.zst
nas_disk: local-lvm:4 # 4 GB
nas_netif:
  # net0: backend, DHCPv6
  net0: "name=eth0,bridge=vmbr1,tag=3,firewall=1,ip6=dhcp"
nas_features:
  - nesting=1 # Required somehow
# Boot NAS first, then wait 180s before starting the other containers so their
# storage (mounted from the NAS) is available beforehand.
nas_startup:
  - order=1
  - up=180
