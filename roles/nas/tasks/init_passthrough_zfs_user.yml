---
# https://pve.proxmox.com/wiki/Unprivileged_LXC_containers

# BUG: sometimes this is not idempotent?
# This is so that the owner of the files are the same regardless of host or tenant
- name: Passthrough uid 1000 to nas container
  ansible.builtin.lineinfile:
    path: /etc/pve/lxc/100.conf
    line: "{{ item }}"
    regexp: "^{{ item }}"
    state: present
    backrefs: true
  loop:
    - "lxc.idmap: u 0 100000 1000"
    - "lxc.idmap: g 0 100000 1000"
    - "lxc.idmap: u 1000 1000 1"
    - "lxc.idmap: g 1000 1000 1"
    - "lxc.idmap: u 1001 101001 64535"
    - "lxc.idmap: g 1001 101001 64535"

- name: Allow root to do the mapping
  ansible.builtin.lineinfile:
    path: "/etc/{{ item.path }}"
    line: "{{ item.line }}"
  loop:
    - path: subuid
      line: "root:1000:1"
    - path: subgid
      line: "root:1000:1"
