---
# Mutable, reconcilable configuration for the live NAS LXC, applied from the Proxmox
# host (configure.yml). Two concerns:
#   - resources: `update: true` pushes cores/memory/swap into the existing container
#     without recreating it (the same params are read at creation by init_lxc.yml).
#   - bind mounts: lineinfile keyed on `^mp0:`/`^mp1:` reconciles each mount line in
#     place. blockinfile is unusable here: Proxmox normalizes /etc/pve/lxc/100.conf and
#     relocates the mp keys out of any markers, so a marked block gets re-added as a
#     duplicate every run. A changed mount takes effect on the next container restart.
- name: Load NAS resource parameters
  ansible.builtin.include_vars: "{{ item }}"
  loop:
    - init.yml # for nas_vmid / nas_hostname
    - config.yml

- name: Reconcile NAS LXC resources
  community.proxmox.proxmox:
    api_host: "{{ proxmox_host }}"
    api_user: "{{ proxmox_user }}"
    api_password: "{{ proxmox_password }}"
    node: "{{ proxmox_host }}"
    vmid: "{{ nas_vmid }}"
    # hostname is immutable, but the proxmox module requires it whenever
    # state=present (the default) — pass it through unchanged.
    hostname: "{{ nas_hostname }}"
    cores: "{{ nas_cores }}"
    memory: "{{ nas_memory }}"
    swap: "{{ nas_swap }}"
    update: true

- name: Bind mount frontpanel-dataset into nas
  ansible.builtin.lineinfile:
    path: /etc/pve/lxc/100.conf
    regexp: "^mp0:"
    line: "mp0: /mnt/frontpanel-pool/frontpanel-dataset,mp=/mnt/frontpanel-dataset"
    state: present

# Shared Nextcloud directory, also bind-mounted into dockerdmz. nas accesses it as
# `diwangs` (uid 1000) via its existing 1000->1000 idmap, so no idmap change needed.
- name: Bind mount shared Nextcloud directory into nas
  ansible.builtin.lineinfile:
    path: /etc/pve/lxc/100.conf
    regexp: "^mp1:"
    line: "mp1: /home/diwangs/nextcloud,mp=/home/diwangs/nextcloud"
    state: present
