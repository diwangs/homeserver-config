---
# Mutable in-tenant configuration for the NAS (cockpit + the user that owns the
# data on the drive). Re-runnable; driven by configure.yml.
- name: Create user that owns the file on the drive
  ansible.builtin.user:
    name: diwangs
    uid: 1000 # Important!
    password: "{{ proxmox_password | password_hash('sha512') }}"
    shell: /bin/bash
    update_password: on_create

# Update repository
# - import_tasks: update_apt.yml
# - import_tasks: upgrade_dist_apt.yml

- name: Install cockpit (no-install-recommends)
  ansible.builtin.apt:
    name: cockpit
    install_recommends: false
    state: present
    update_cache: true

- name: Allow root to login to cockpit
  ansible.builtin.lineinfile:
    path: /etc/cockpit/disallowed-users
    regexp: "^root$"
    state: absent

- name: Install cockpit plugins manually
  ansible.builtin.apt:
    deb: "{{ item }}"
  loop:
    - "{{ cockpit_file_sharing_url }}"
    - "{{ cockpit_identities_url }}"
    - "{{ cockpit_navigator_url }}"

