---
# Immutable creation parameters for the seedbox LXC (vmid 104). Applied once by
# roles/seedbox/tasks/init_lxc.yml; never reconciled afterwards.
seedbox_vmid: 104
seedbox_hostname: seedbox
# TODO: make sure the template exist first?
seedbox_ostemplate: local:vztmpl/debian-12-standard_12.7-1_amd64.tar.zst
seedbox_disk: local-lvm:200 # 200 GB for storing unfinished torrents
seedbox_netif:
  # net0: DHCPv6
  net0: "name=eth0,bridge=vmbr1,tag=3,firewall=1,ip6=dhcp"
seedbox_unprivileged: false # Needed for SMB mounting
seedbox_features:
  - nesting=1 # Newer Systemd requires namespacing
  - mount=cifs
