---
# Reconcile mutable LXC resources onto the live Omada container. Runs on the
# Proxmox host (configure.yml); `update: true` updates an existing container.
- name: Load Omada resource parameters
  ansible.builtin.include_vars: "{{ item }}"
  loop:
    - init.yml # for omada_vmid
    - config.yml

- name: Reconcile Omada LXC resources
  community.proxmox.proxmox:
    api_host: "{{ proxmox_host }}"
    api_user: "{{ proxmox_user }}"
    api_password: "{{ proxmox_password }}"
    node: "{{ proxmox_host }}"
    vmid: "{{ omada_vmid }}"
    # hostname is immutable, but the proxmox module requires it whenever
    # state=present (the default) — pass it through unchanged.
    hostname: "{{ omada_hostname }}"
    cores: "{{ omada_cores }}"
    memory: "{{ omada_memory }}"
    swap: "{{ omada_swap }}"
    update: true
